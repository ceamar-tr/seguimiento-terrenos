    if(b.dataset.act==='doc'){ dd.estado=b.dataset.o==='Completo'?'Completo':''; if(dd.estado&&!dd.fecha) dd.fecha=HOY_S; if(!dd.estado) dd.fecha=''; if(dd.estado&&!dd.resp&&c.equipo.indexOf(usuario)>=0) dd.resp=usuario; guardarDoc(c,dd); render(); return; }
    if(b.dataset.act==='copiar'){ var inp=dr.querySelector('[data-f=ruta]'); if(!inp.value){ toast('No hay ruta para copiar'); return; }
      try{ navigator.clipboard.writeText(inp.value).then(function(){toast('Ruta copiada');},function(){inp.select();toast('Selecciona y copia la ruta');}); }catch(x){ inp.select(); toast('Selecciona y copia la ruta'); } } }
});
W.addEventListener('toggle',function(e){ var g=e.target.closest&&e.target.closest('details[data-m]'); if(g) S.open[g.dataset.m]=g.open; },true);
W.addEventListener('input',function(e){ if(e.target.id==='proy-q'){ S.pq=e.target.value; pintarProyectos(); return; }
  var el=e.target; if(el.tagName!=='INPUT'||!(el.dataset.pl||el.dataset.plh)) return; if(el.dataset.plh&&/^(arr)$/.test(el.dataset.col)) return;
  var c=getC(S.cid); if(!c) return; var pk=el.dataset.pl||el.dataset.plh, P=getPlan(c,S.mon,pk,true);
  if(el.dataset.plh){ P.hdr=P.hdr||{}; P.hdr[el.dataset.col]=el.value.trim(); } else P.rows.forEach(function(r){ if(r.id===el.dataset.row) r[el.dataset.col]=el.value.trim(); });
  refrescarPlan(c,pk); clearTimeout(S.plT); S.plT=setTimeout(function(){ guardarPlan(c,S.mon,pk); },1200); });
W.addEventListener('change',function(e){
  var el=e.target;
  if(el.id==='h-proy'||el.id==='h-anio'){ if(el.id==='h-proy') S.hProy=el.value; else S.hAnio=el.value; renderHistorial(); return; }
  var c=getC(S.cid); if(!c||S.tab!=='detalle') return;
  if(el.dataset.clima){ c.monClima=c.monClima||{}; c.monClima[S.mon]=c.monClima[S.mon]||{}; var kd=c.monClima[S.mon][S.fechaTrabajo]=c.monClima[S.mon][S.fechaTrabajo]||{};
    kd[el.dataset.clima]=el.value.trim(); if(el.dataset.clima==='vint'&&el.value==='Calma') kd.vdir=''; guardarClima(c,S.mon,S.fechaTrabajo); renderDetalle(); return; }
  if(el.dataset.pl||el.dataset.plh){ var pkc=el.dataset.pl||el.dataset.plh, PC=getPlan(c,S.mon,pkc,true);
    if(el.dataset.plh){ PC.hdr=PC.hdr||{}; PC.hdr[el.dataset.col]=el.value.trim(); }
    else PC.rows.forEach(function(r){ if(r.id===el.dataset.row) r[el.dataset.col]=el.value.trim(); });
    guardarPlan(c,S.mon,pkc);
    if(el.dataset.plh&&/^(pts|arr|mus)$/.test(el.dataset.col)){ armarFilas(c,S.mon,PC); guardarPlan(c,S.mon,pkc); renderDetalle(); return; }
    refrescarPlan(c,pkc); return; }
  if(el.dataset.rdiam){ var lr2=redesMon(c,S.mon); lr2.forEach(function(r){ if(r.red===el.dataset.rdiam) r.diam=el.value.trim(); }); guardarRedes(c,S.mon); renderDetalle(); return; }
  if(el.id==='fecha-trabajo'){ S.fechaTrabajo=el.value||fechaTrabajoDef(c); renderDetalle(); return; }
  var row=el.closest('[data-t]');
  if(row){ var t=c.tareas.filter(function(x){return x.id===row.dataset.t;})[0], m=mOf(c,t.mon), f=el.dataset.f;
    if(f==='resp') t.resp=el.value;
    else if(f==='fecha'){ t.fecha=el.value; if(!el.value) t.hora=''; }
    else if(f==='motivo') t.motivo=el.value;
    else if(f==='ok'||f==='cnt'){ var dk=f==='ok'?'ok':'cnt'; t.datos[dk]=t.datos[dk]||{};
      if(f==='ok') t.datos.ok[el.dataset.k]=el.checked; else t.datos.cnt[el.dataset.k]=el.value===''?'':Math.max(0,+el.value);
      var it=m.items.filter(function(x){return x.k===el.dataset.k.split('|')[0];})[0];
      if(it&&it.med&&el.checked){ t.datos.hora=t.datos.hora||{}; if(!t.datos.hora[it.k]){ var nn=new Date(); t.datos.hora[it.k]=pad(nn.getHours())+':'+pad(nn.getMinutes()); } }
      var got=contar(m,t.datos); if(got){ t.estado=got>=m.total?'Realizado':'Parcial'; sello(t,c); } }
    else if(f==='hora'){ t.datos.hora=t.datos.hora||{}; t.datos.hora[el.dataset.k]=el.value; }
    guardarTarea(c,t); render(); return; }
  var dr=el.closest('[data-d]');
  if(dr){ var d=c.docs[+dr.dataset.d]; if(el.dataset.f==='dresp') d.resp=el.value; if(el.dataset.f==='ruta') d.ruta=el.value.trim(); guardarDoc(c,d); render(); }
});
var SP=document.getElementById('sp');
document.getElementById('ov').addEventListener('click',cerrarNueva);
SP.addEventListener('submit',function(e){ e.preventDefault(); });
SP.addEventListener('change',function(e){ var el=e.target;
  if(el.id==='n-proy'){ draft.proyecto=el.value; draft.periodo=perPorDefecto(MATRIZ[el.value],draft.anio); draft.ini=draft.fin=fechaSugerida(draft.periodo,draft.anio); }
  if(el.id==='n-per'){ draft.periodo=el.value; draft.ini=draft.fin=fechaSugerida(el.value,draft.anio); } if(el.id==='n-anio') draft.anio=+el.value; if(el.id==='n-ini'){ draft.ini=el.value; if(draft.fin<el.value) draft.fin=el.value; } if(el.id==='n-fin') draft.fin=el.value;
  if(el.id==='n-jefe'){ draft.jefe=el.value; if(draft.equipo.indexOf(el.value)<0) draft.equipo.push(el.value); }
  if(el.dataset.eq){ var n=el.dataset.eq; draft.equipo=el.checked?draft.equipo.concat(draft.equipo.indexOf(n)<0?[n]:[]):draft.equipo.filter(function(x){return x!==n;}); }
  renderNueva(); });
SP.addEventListener('click',function(e){ var b=e.target.closest('button'); if(!b) return;
  if(b.id==='n-cancelar'){ cerrarNueva(); return; }
  if(b.id==='n-crear'){
    if(!draft.equipo.length){ toast('Elige al menos una persona para el equipo'); return; }
    if(!draft.periodo){ toast('Este proyecto no tiene periodos en la matriz'); return; }
    if(draft.fin<draft.ini){ toast('La fecha de término es anterior a la de inicio'); return; }
    var c=nuevaCampana(draft.proyecto,draft.anio,draft.periodo,draft.ini,draft.fin,draft.jefe,draft.equipo);
    if(getC(c.id)){ toast('Ya existe la campaña '+c.id); return; }
    c.estadoAdm='Abierta'; c.creadaPor=usuario; c.creadaEl=ahoraTxt(); CAMP_ALL.push(c); vista(); enviar('crearCampana',{id:c.id,proyecto:c.proyecto,nombreProyecto:MATRIZ[c.proyecto].nombre,anio:c.anio,periodo:c.periodo,inicio:c.ini,termino:c.fin,jefe:c.jefe,equipo:c.equipo,
      tareas:c.tareas.map(function(t){return {id:t.id,mon:t.mon,est:t.est};}),docs:c.docs.map(function(d){return {n:d.n,t:d.t};})});
    cerrarNueva(); abrir(c.id,'muestreo'); toast('Campaña programada: '+c.tareas.length+' tareas y '+c.docs.length+' documentos'); } });

// ─── INICIO ──────────────────────────────────────────────
aplicarZoom(); pintarTema();
function altoTop(){ var t=document.querySelector('.top'); if(t) document.documentElement.style.setProperty('--top-h',t.offsetHeight+'px'); }
altoTop(); window.addEventListener('resize',altoTop);
cargarMatriz().catch(function(){ toast('No se pudo leer la matriz en línea; se usa la copia exportada'); CONFIG.MATRIZ_ID=''; return cargarMatriz(); })
  .then(function(){
    pintarNota();
    if(DEMO){ cargarCamp(); var vc=''; try{ vc=localStorage.getItem('ceamar_terreno_ver_como')||''; }catch(e){}
      fijarUsuario(USUARIOS_PRUEBA.filter(function(u){return u.nombre===vc;})[0]||USUARIOS_PRUEBA[0]); pintarUsuario(); render(); return; }
    // Muestra al tiro la última copia guardada en el equipo y la actualiza cuando responde el servidor (Apps Script tarda unos segundos).
    if(SESION){ var vis=copiaRapida();
      api('datos').then(function(r){ if(r.ok){ aplicarDatos(r); flush(); } else if(r.error==='sesion') pedirLogin(r.mensaje); else if(vis) toast('El servidor no respondió bien. Se muestran los datos guardados en este equipo.'); else usarCopia('El servidor no respondió bien.'); })
        .catch(function(){ if(vis) toast('Sin conexión. Se muestran los datos guardados en este equipo; lo que marques se enviará al volver la señal.'); else usarCopia('Sin conexión.'); }); }
    else pedirLogin();
  });
}
