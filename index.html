<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seguimiento de Terrenos CEAMAR</title>
<link rel="icon" type="image/png" href="logos/ceamar-favicon.png">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* VOICE: herramienta de terreno de CEAMAR; colores de la página de informes, estructura propia de muestreo.
     IDEA: la libreta de terreno: calendario de campañas y, dentro de cada una, la grilla estación × día.
     PICTURE: calendario (mes / año por proyecto) y grilla de estaciones con lo muestreado cada día.
     COLOUR/TYPE: verde #1a5c2e y azul #0d3d5c de CEAMAR; DM Sans.
     LAYOUT: barra blanca fija con pestañas subrayadas; contenido hasta 1300px; una columna en celular. */
  :root,[data-theme="light"]{
    --verde:#1a5c2e;--verde-s:#e8f5e9;--azul:#0d3d5c;--azul-c:#1565c0;--azul-s:#e3f2fd;
    --amber:#e65100;--amber-s:#fff3e0;--rojo:#c62828;--rojo-s:#ffebee;
    --gris:#f4f6f8;--borde:#e0e0e0;--texto:#1a1a2e;--suave:#6b7280;
    --sombra:0 2px 14px rgba(0,0,0,0.07);--sombra-hover:0 8px 28px rgba(0,0,0,0.13);
    --r:14px;--bg:#f0f4f8;--card-bg:#ffffff;color-scheme:light;
  }
  [data-theme="dark"]{
    --verde:#4caf50;--verde-s:#1b3a20;--azul:#90caf9;--azul-c:#64b5f6;--azul-s:#0d2137;
    --amber:#ffb74d;--amber-s:#2d1f00;--rojo:#ef5350;--rojo-s:#2d0e0e;
    --gris:#1e2736;--borde:#2d3a4a;--texto:#e2e8f0;--suave:#94a3b8;
    --sombra:0 2px 14px rgba(0,0,0,0.35);--sombra-hover:0 8px 28px rgba(0,0,0,0.5);
    --bg:#0f1623;--card-bg:#1a2333;color-scheme:dark;
  }
  *{box-sizing:border-box;margin:0;padding:0;min-width:0;}
  [hidden]{display:none!important;}
  html{background:var(--bg);}
  body{font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--texto);min-height:100vh;font-size:14px;overflow-x:clip;}
  button,input,select{font-family:inherit;font-size:inherit;color:inherit;}
  button{cursor:pointer;}
  :focus-visible{outline:3px solid var(--azul-c);outline-offset:2px;}
  .num{font-variant-numeric:tabular-nums;}

  /* BARRA SUPERIOR (blanca, propia de terreno) */
  .top{position:sticky;top:0;z-index:100;background:linear-gradient(135deg,#1a5c2e 0%,#0d3d5c 100%);box-shadow:0 4px 20px rgba(0,0,0,0.18);}
  .top-in{max-width:1300px;margin:0 auto;padding:14px 22px 0;}
  .top-row{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;}
  .brand{display:flex;align-items:center;gap:12px;margin-right:auto;}
  .brand-logo{background:#fff;border-radius:12px;padding:6px 14px;display:flex;align-items:center;flex-shrink:0;}
  .brand img{height:46px;width:auto;display:block;}
  .brand-t{font-size:17px;font-weight:700;color:#fff;line-height:1.1;}
  .brand-s{font-size:11px;color:rgba(255,255,255,0.65);margin-top:3px;}
  .ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .pillbtn,.selu{border:1px solid rgba(255,255,255,0.22);background:rgba(255,255,255,0.12);color:#fff;border-radius:20px;padding:6px 12px;font-size:12px;font-weight:600;}
  .selu option{color:#1a1a2e;background:#fff;}
  .zoom{display:flex;border:1px solid rgba(255,255,255,0.22);border-radius:20px;overflow:hidden;}
  .zoom button{border:none;background:rgba(255,255,255,0.12);color:#fff;padding:6px 10px;font-weight:700;font-size:12px;}
  .zoom button+button{border-left:1px solid rgba(255,255,255,0.22);}
  .net{display:inline-flex;align-items:center;gap:6px;}
  .net i{width:8px;height:8px;border-radius:50%;background:#4caf50;}
  .net.off{color:#ffcc80;border-color:#ffcc80;}.net.off i{background:#ffb74d;}
  .net.demo i{background:#90caf9;}
  .nav{display:flex;gap:2px;margin-top:10px;overflow-x:auto;}
  .nav button{border:none;background:none;padding:10px 16px;font-weight:600;font-size:14px;color:rgba(255,255,255,0.7);border-bottom:3px solid transparent;white-space:nowrap;}
  .nav button:hover{color:#fff;}
  .nav button[aria-selected="true"]{color:#fff;border-bottom-color:#fff;font-weight:700;}

  .wrap{max-width:1300px;margin:0 auto;padding:20px 22px 40px;}
  .tc{display:none;}.tc.on{display:block;}
  .demo-note{font-size:12px;color:var(--suave);background:var(--card-bg);border:1px dashed var(--borde);border-radius:8px;padding:8px 12px;margin-bottom:16px;}
  .alertas{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
  .alerta{display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:10px;font-size:12px;font-weight:500;flex:1;min-width:230px;border:none;text-align:left;}
  .alerta b{font-size:15px;}
  .alerta-rojo{background:var(--rojo-s);border:1px solid #ef9a9a;color:var(--rojo);}
  .alerta-amber{background:var(--amber-s);border:1px solid #ffcc80;color:var(--amber);}
  .alerta-verde{background:var(--verde-s);border:1px solid #a5d6a7;color:var(--verde);}
  [data-theme="dark"] .alerta{border-color:transparent;}
  .h1{font-size:22px;font-weight:800;color:var(--azul);}
  .sub{font-size:12px;color:var(--suave);}
  .bar-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px;}
  .spacer{margin-left:auto;}
  .seg{display:inline-flex;border:1px solid var(--borde);border-radius:20px;overflow:hidden;background:var(--card-bg);}
  .seg button{border:none;background:none;padding:6px 14px;font-size:12px;font-weight:600;color:var(--suave);}
  .seg button+button{border-left:1px solid var(--borde);}
  .seg button[aria-pressed="true"]{background:var(--verde);color:#fff;}
  .arrow{border:1px solid var(--borde);background:var(--card-bg);border-radius:20px;width:34px;height:34px;font-weight:700;}
  .btn-p{padding:8px 16px;border-radius:20px;border:none;background:var(--verde);color:white;font-weight:600;font-size:13px;}
  [data-theme="dark"] .btn-p,[data-theme="dark"] .seg button[aria-pressed="true"]{color:#0f1623;}
  .btn-s{padding:6px 12px;border-radius:20px;border:1px solid var(--borde);background:var(--card-bg);color:var(--suave);font-size:12px;font-weight:600;}
  .btn-s:hover{border-color:var(--verde);color:var(--verde);}
  .leyenda{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--suave);margin-bottom:12px;}
  .leyenda span{display:inline-flex;align-items:center;gap:5px;}
  .sw{width:12px;height:12px;border-radius:3px;display:inline-block;border:1.5px solid currentColor;}
  .nav button,.subnav button,.seg button,.zoom button{flex-shrink:0;}
  .net .sh{display:none;}

  /* ESTADOS (colores de informes) */
  .e-comp{background:var(--verde-s);color:var(--verde);}
  .e-terr{background:var(--amber-s);color:var(--amber);}
  .e-prog{background:var(--azul-s);color:var(--azul-c);}
  .e-pend{background:var(--rojo-s);color:var(--rojo);}
  .e-porp{background:transparent;color:var(--suave);border:1px dashed var(--suave);}
  .e-sinr{background:var(--rojo-s);color:var(--rojo);border:1px dashed var(--rojo);}

  /* CALENDARIO MENSUAL */
  .cal{background:var(--card-bg);border-radius:var(--r);box-shadow:var(--sombra);overflow:hidden;}
  .cal-head,.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));}
  .cal-head div{padding:8px 10px;font-size:11px;font-weight:700;color:var(--suave);text-transform:uppercase;letter-spacing:.4px;border-bottom:1px solid var(--borde);}
  .dia{min-height:112px;border-right:1px solid var(--borde);border-bottom:1px solid var(--borde);padding:6px;display:flex;flex-direction:column;gap:4px;}
  .dia:nth-child(7n){border-right:none;}
  .dia.fuera{background:var(--gris);}
  .dia.fuera .dnum{opacity:.45;}
  .dnum{font-size:12px;font-weight:700;color:var(--suave);}
  .dia.hoy .dnum{background:var(--verde);color:#fff;border-radius:10px;padding:1px 7px;width:fit-content;}
  .ev{border:none;text-align:left;border-radius:6px;padding:4px 6px;font-size:11px;font-weight:600;line-height:1.25;width:100%;}
  .ev small{display:block;font-weight:500;opacity:.85;}
  .agenda{display:none;}
  .avance{background:var(--card-bg);border-radius:var(--r);box-shadow:var(--sombra);padding:14px 16px;margin-bottom:16px;}
  .av-top{display:flex;align-items:center;gap:14px;margin-bottom:10px;}
  .av-big{font-size:34px;font-weight:800;color:var(--verde);line-height:1;}
  .av-row{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(80px,1fr) 70px;align-items:center;gap:12px;width:100%;border:none;background:none;text-align:left;padding:9px 4px;border-top:1px solid var(--borde);color:var(--texto);cursor:pointer;}
  .av-row:hover{background:var(--gris);}
  .av-nom b{font-size:13px;}
  .av-nom small{display:block;font-size:11px;color:var(--suave);margin-top:2px;}
  .av-row.listo .av-nom small{color:var(--verde);font-weight:700;}
  .av-row .pbar,.et-card .pbar{display:block;height:8px;border-radius:5px;background:var(--gris);overflow:hidden;}
  .av-row .pfill,.et-card .pfill{display:block;height:100%;background:var(--verde);border-radius:5px;}
  .av-num{text-align:right;font-size:11px;color:var(--suave);}
  .av-num b{display:block;font-size:14px;color:var(--texto);}
  .inp-f{width:auto;padding:4px 8px;}
  .en-terreno{display:grid;gap:8px;margin-bottom:14px;}
  .et-card{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card-bg);border:2px solid var(--amber);border-radius:var(--r);box-shadow:var(--sombra);padding:10px 14px;cursor:pointer;color:var(--texto);}
  .et-txt{flex:1;display:grid;gap:4px;}
  .et-txt small{font-size:11.5px;color:var(--suave);}
  .et-pct{font-size:22px;font-weight:800;color:var(--verde);text-align:right;}
  .et-pct small{display:block;font-size:11px;font-weight:700;color:var(--azul);}
  .ck{display:grid;grid-template-columns:280px minmax(0,1fr);gap:16px;align-items:start;}
  .ck-mons{position:sticky;top:140px;background:var(--card-bg);border-radius:var(--r);box-shadow:var(--sombra);padding:8px;display:grid;gap:2px;max-height:calc(100vh - 160px);overflow:auto;}
  .ck-total{display:grid;gap:4px;padding:8px 10px 12px;border-bottom:1px solid var(--borde);margin-bottom:4px;font-size:12px;color:var(--suave);}
  .ck-big{font-size:30px;font-weight:800;color:var(--verde);line-height:1;}
  .ck-mon{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 8px;align-items:center;width:100%;text-align:left;border:none;background:none;border-radius:10px;padding:9px 10px;color:var(--texto);cursor:pointer;}
  .ck-mon:hover{background:var(--gris);}
  .ck-mon.sel{background:var(--verde-s);box-shadow:inset 3px 0 0 var(--verde);}
  .ck-mn b{font-size:13px;display:block;}
  .ck-mn small{font-size:11px;color:var(--suave);}
  .ck-mon.listo .ck-mn small{color:var(--verde);font-weight:700;}
  .ck-pct{font-size:13px;font-weight:800;}
  .ck-mon .pbar,.ck-total .pbar{grid-column:1/-1;display:block;height:5px;border-radius:4px;background:var(--gris);overflow:hidden;}
  .ck-mon .pfill,.ck-total .pfill{display:block;height:100%;background:var(--verde);}
  .ck-main{background:var(--card-bg);border-radius:var(--r);box-shadow:var(--sombra);padding:14px 16px;scroll-margin-top:140px;}
  .ck-head{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-start;justify-content:space-between;margin-bottom:10px;}
  .ck-head>div:first-child{flex:1;min-width:200px;}
  .ck-tit{font-size:18px;font-weight:800;color:var(--azul);}
  .ck-cnt{font-size:13px;font-weight:700;color:var(--suave);margin-left:4px;}
  .ck-list{border:1px solid var(--borde);border-radius:10px;overflow:hidden;}
  .ck-row{display:flex;align-items:center;gap:8px;padding:6px 8px 6px 4px;border-top:1px solid var(--borde);}
  .ck-row:first-child{border-top:none;}
  .ck-row.e-realizado,.ck-row.e-no-aplica{background:var(--verde-s);}
  .ck-info{flex:1;min-width:0;display:flex;align-items:center;gap:10px;border:none;background:none;text-align:left;padding:4px;color:var(--texto);cursor:pointer;}
  .ck-dot{flex:0 0 26px;height:26px;border-radius:50%;border:2px solid var(--borde);display:grid;place-items:center;font-size:13px;font-weight:800;color:#fff;}
  .e-realizado .ck-dot{background:var(--verde);border-color:var(--verde);}
  .e-no-aplica .ck-dot{background:var(--suave);border-color:var(--suave);}
  .e-parcial .ck-dot{background:var(--amber);border-color:var(--amber);}
  .e-no-realizado .ck-dot{background:var(--rojo);border-color:var(--rojo);}
  .ck-est{min-width:0;}
  .ck-est b{font-size:14px;display:block;}
  .ck-est small{font-size:10.5px;color:var(--suave);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;}
  .ck-meta{margin-left:auto;font-size:11px;color:var(--suave);text-align:right;white-space:nowrap;display:grid;gap:1px;}
  .ck-meta em{font-style:normal;color:var(--rojo);font-weight:700;}
  .ck-meta em.az{color:var(--azul);}
  .ck-seg{margin-left:0;flex:0 0 auto;}
  .ck-seg button{min-width:40px;padding:6px 8px;}
  .ck-mas{border:none;background:none;font-size:22px;color:var(--suave);padding:0 6px;cursor:pointer;}
  .ficha-ov{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:500;}
  .ficha{position:fixed;top:0;right:0;width:520px;max-width:100vw;height:100%;background:var(--card-bg);z-index:501;box-shadow:-6px 0 32px rgba(0,0,0,.18);display:flex;flex-direction:column;}
  .ficha-h{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--borde);}
  .ficha-b{overflow:auto;padding:4px 6px 20px;}
  .ficha-b .st{border:none;box-shadow:none;}
  .ficha-b .st-name{display:none;}
  .tit-s{font-size:13px;font-weight:600;color:var(--suave);margin-left:6px;}
  .trim{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;}
  .mm{background:var(--card-bg);border-radius:var(--r);box-shadow:var(--sombra);padding:12px 12px 10px;}
  .mm-t{font-size:15px;font-weight:700;color:var(--azul);margin-bottom:8px;}
  .mm-h,.mm-g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;}
  .mm-h div{font-size:10px;font-weight:700;color:var(--suave);text-align:center;padding-bottom:4px;}
  .md{min-height:58px;border-radius:7px;background:var(--gris);padding:3px;display:flex;flex-direction:column;gap:2px;}
  .md.vacio{background:none;}
  .mdn{font-size:11px;font-weight:700;color:var(--suave);padding-left:2px;}
  .md.hoy{outline:2px solid var(--verde);}
  .md.hoy .mdn{color:var(--verde);}
  .mev{border:none;border-radius:4px;padding:2px 3px;font-size:9.5px;font-weight:700;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%;}
  .est-lista{margin-top:14px;background:var(--card-bg);border-radius:var(--r);box-shadow:var(--sombra);padding:12px 14px;}
  .est-it{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;width:100%;border:none;background:none;text-align:left;padding:8px 4px;border-top:1px solid var(--borde);font-size:13px;color:var(--texto);}
  .est-it span{font-size:12px;color:var(--suave);}
  .est-it .badge{margin-left:auto;}
  .ag-dia{background:var(--card-bg);border-radius:10px;box-shadow:var(--sombra);padding:10px 12px;margin-bottom:8px;display:grid;gap:6px;}
  .ag-dia.hoy{outline:2px solid var(--verde);}
  .ag-f{font-size:12px;font-weight:700;color:var(--suave);}

  /* CALENDARIO ANUAL (proyectos × meses) */
  .twrap{overflow-x:auto;}
  .anual{width:100%;border-collapse:separate;border-spacing:0;background:var(--card-bg);border-radius:var(--r);box-shadow:var(--sombra);font-size:12px;}
  .anual th{font-size:10px;font-weight:700;color:var(--suave);text-transform:uppercase;padding:9px 6px;border-bottom:1px solid var(--borde);text-align:center;white-space:nowrap;}
  .anual th.mes-act{color:var(--verde);}
  .anual td{padding:6px 4px;border-bottom:1px solid var(--borde);text-align:center;}
  .anual tr:last-child td{border-bottom:none;}
  .anual td.pcol,.anual th.pcol{position:sticky;left:0;background:var(--card-bg);text-align:left;padding:8px 12px;z-index:1;min-width:210px;}
  .pcell{display:flex;align-items:center;gap:10px;}
  .pcell img{width:44px;height:26px;object-fit:contain;background:#fff;border-radius:5px;padding:2px;}
  .pname{font-weight:700;color:var(--azul);font-size:13px;}
  .pfrec{font-size:10px;color:var(--suave);}
  .mc{border:none;border-radius:6px;width:100%;min-width:58px;padding:6px 2px;font-size:10px;font-weight:700;line-height:1.2;}
  .mc.vacio{background:none;color:var(--borde);cursor:default;}
  .mc b{font-size:11px;}
  .mc small{display:block;font-weight:600;font-size:9.5px;opacity:.85;margin-top:2px;}
  .e-prev{display:block;background:var(--gris);color:var(--suave);border:1px solid var(--borde);cursor:default;}
  .anual td.slot{padding:6px 5px;}
  .anual td.slot.act{background:var(--verde-s);}
  .mcods{font-size:9.5px;color:var(--suave);margin-top:4px;line-height:1.3;white-space:normal;}

  /* KPIs y tarjetas de campaña */
  .kgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:16px;}
  .kpi{background:var(--card-bg);border-radius:var(--r);padding:16px 18px;box-shadow:var(--sombra);border-left:3px solid transparent;}
  .kpi.v{border-left-color:var(--verde)}.kpi.a{border-left-color:var(--azul-c)}.kpi.am{border-left-color:var(--amber)}.kpi.r{border-left-color:var(--rojo)}.kpi.t{border-left-color:var(--azul)}
  .klabel{font-size:11px;color:var(--suave);font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;}
  .kval{font-size:28px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;}
  .ksub{font-size:12px;color:var(--suave);margin-top:4px;}
  .franja{display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:var(--card-bg);border-radius:var(--r);box-shadow:var(--sombra);padding:10px 14px;margin-bottom:14px;}
  .franja-t{font-size:12px;font-weight:700;color:var(--suave);margin-right:4px;}
  .tocas{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}
  .toca{border-radius:8px;padding:6px 10px;font-size:12px;font-weight:700;text-align:left;line-height:1.25;}
  button.toca{cursor:pointer;}
  .toca small{display:block;font-size:10.5px;font-weight:600;opacity:.85;}
  .pcard2{display:flex;gap:14px;align-items:flex-start;cursor:default;}
  .ccard.pcard2:hover{transform:none;box-shadow:var(--sombra);}
  .cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,360px),1fr));gap:16px;}
  .ccard{background:var(--card-bg);border-radius:var(--r);padding:16px;box-shadow:var(--sombra);border:none;text-align:left;width:100%;transition:transform .2s,box-shadow .2s;display:flex;gap:14px;align-items:flex-start;}
  .ccard:hover{transform:translateY(-3px);box-shadow:var(--sombra-hover);}
  .logo{width:72px;min-height:64px;flex-shrink:0;display:flex;align-items:center;justify-content:center;border-radius:12px;background:#fff;border:1px solid var(--borde);padding:8px;}
  .logo img{max-width:56px;max-height:44px;object-fit:contain;}
  .cname{font-size:16px;font-weight:700;color:var(--azul);line-height:1.25;}
  .cmeta{font-size:11px;color:var(--suave);margin:3px 0 8px;}
  .badge{display:inline-block;font-size:10px;font-weight:700;padding:2px 8px;border-radius:12px;margin-left:6px;vertical-align:2px;}
  .prow{display:grid;grid-template-columns:78px minmax(0,1fr) 40px;align-items:center;gap:8px;margin-bottom:5px;font-size:11px;color:var(--suave);font-weight:600;}

function prog(c){
  var T=c.tareas.length,done=0,sinMarcar=0,sinMotivo=0,noReal=0,parcial=0;
  c.tareas.forEach(function(t){ if(t.estado==='Realizado'||t.estado==='No aplica') done++; if(!t.estado) sinMarcar++; if(t.estado==='No realizado') noReal++; if(t.estado==='Parcial') parcial++;
    if((t.estado==='No realizado'||t.estado==='Parcial')&&!t.motivo.trim()) sinMotivo++; });
  var D=c.docs.length,dDone=0,dPend=0,dSinRuta=0;
  c.docs.forEach(function(d){ if(d.estado==='Completo'&&d.ruta.trim()) dDone++; if(d.estado!=='Completo') dPend++; if(d.estado==='Completo'&&!d.ruta.trim()) dSinRuta++; });
  return {T:T,done:done,pm:T?Math.round(100*done/T):0,pd:D?Math.round(100*dDone/D):0,sinMarcar:sinMarcar,sinMotivo:sinMotivo,noReal:noReal,parcial:parcial,D:D,dPend:dPend,dSinRuta:dSinRuta};
}

// Cada periodo de la matriz ocupa sus meses (estaciones del año: Verano ene–mar, Otoño abr–jun, Invierno jul–sep, Primavera oct–dic).
function planAnual(anio){
  var mesHoy=HOY.getMonth()+1, anioHoy=HOY.getFullYear();
  return Object.keys(MATRIZ).map(function(pid){
    var p=MATRIZ[pid];
    var slots=p.periodos.map(function(per){
      var ms=mesesPeriodo(per); if(!ms.length) return null;
      var fin=iso(new Date(anio,ms[ms.length-1],0)), ini=anio+'-'+pad(ms[0])+'-01';
      var c=CAMP.filter(function(x){return x.proyecto===pid&&x.anio===anio&&x.periodo===per;})[0];
      var actual=anio===anioHoy&&ms.indexOf(mesHoy)>=0, mons=monsDe(pid,per);
      var s={per:per,meses:ms,actual:actual,mons:mons,ini:ini,fin:fin};
      if(c){ s.k='camp'; s.c=c; s.e=estadoCamp(c); }
      else if(fin<(CONFIG.INICIO_SEGUIMIENTO||'')) s.k='previo';
      else if(fin<HOY_S) s.k='sinr';
      else s.k='porp';
      return s;

    return {pid:pid,p:p,slots:slots};

}

function itemLabel(x){ return x.param+(x.estrato?' · '+x.estrato:''); }
function resumenMon(m){
  var mu=m.items.filter(function(x){return !x.med;}), me=m.items.filter(function(x){return x.med;}), out=[];
  var g=[]; mu.forEach(function(x){ var l=g.filter(function(y){return y.param===x.param&&y.n===x.n;})[0]; if(l){ if(x.estrato) l.es.push(x.estrato); } else g.push({param:x.param,n:x.n,es:x.estrato?[x.estrato]:[]}); });

// ─── PENDIENTES Y EQUIPO ─────────────────────────────────
function renderPendientes(){
  var cards=CAMP.filter(function(c){return estadoCamp(c)!=='Programada';}).map(function(c){
    var it=[], porMon={};
    c.tareas.forEach(function(t){
      var mio=esCoord()||t.resp===usuario||(!t.resp&&c.equipo.indexOf(usuario)>=0); if(!mio) return;
      if((t.estado==='No realizado'||t.estado==='Parcial')&&!t.motivo.trim()) it.push('<button class="pit r" data-ir-est="'+esc(t.id)+'"><span>✕</span><span><b>'+esc(estNombre(t.est))+'</b> · '+esc(mOf(c,t.mon).nombre)+' · '+t.estado.toLowerCase()+' sin motivo</span></button>');
      if(!t.estado) porMon[t.mon]=(porMon[t.mon]||[]).concat(estNombre(t.est));
    });
    Object.keys(porMon).forEach(function(k){ var l=porMon[k]; it.push('<button class="pit g" data-abrir="'+esc(c.id)+'" data-sub="muestreo"><span>○</span><span><b>'+esc(mOf(c,k).nombre)+'</b> · '+l.length+' sin marcar: '+esc(l.slice(0,6).join(', '))+(l.length>6?'…':'')+'</span></button>'); });
    c.docs.forEach(function(d){ if(!(esCoord()||d.resp===usuario||(!d.resp&&c.jefe===usuario))) return;
      if(d.estado!=='Completo') it.push('<button class="pit a" data-abrir="'+esc(c.id)+'" data-sub="documentos"><span>○</span><span><b>'+esc(d.n)+'</b> · pendiente</span></button>');
      else if(!d.ruta.trim()) it.push('<button class="pit a" data-abrir="'+esc(c.id)+'" data-sub="documentos"><span>○</span><span><b>'+esc(d.n)+'</b> · falta la ruta del servidor</span></button>'); });
    return '<div class="pcard"><div class="pch">'+logo(c)+'<div class="pnom">'+esc(MATRIZ[c.proyecto].nombre)+'<div class="sub">'+periodoLabel(c)+'</div></div>'+(it.length?'<span class="pbadge">'+it.length+'</span>':'')+'</div><div class="plist">'+(it.length?it.join(''):'<div class="pempty">✓ Nada pendiente</div>')+'</div></div>';
  }).join('');
  document.getElementById('tc-pendientes').innerHTML='<div class="bar-row"><div><div class="h1">Pendientes'+(esCoord()?'':' de '+esc(usuario))+'</div><div class="sub">Lo que falta registrar o completar en cada campaña.</div></div></div><div class="pgrid">'+cards+'</div>';
}
function renderEquipo(){
  document.getElementById('tc-equipo').innerHTML='<div class="bar-row"><div><div class="h1">Equipo de terreno</div><div class="sub">Registros por persona en las campañas abiertas.</div></div></div><div class="egrid">'+PERSONAL.map(function(n){
    var camps=CAMP.filter(function(c){return c.equipo.indexOf(n)>=0;}), hechas=0, prob=0, docs=0, ult='', prox='';
    CAMP.forEach(function(c){ if(c.equipo.indexOf(n)>=0&&c.ini>=HOY_S&&(!prox||c.ini<prox)) prox=c.ini;
      c.tareas.forEach(function(t){ if(t.resp!==n) return; if(t.estado==='Realizado') hechas++; if((t.estado==='No realizado'||t.estado==='Parcial')&&!t.motivo.trim()) prob++; if(t.fecha>ult) ult=t.fecha; });
      c.docs.forEach(function(d){ if(d.resp===n&&d.estado==='Completo') docs++; }); });
    return '<div class="ecard"><div class="eh"><span class="av">'+esc(ini(n))+'</span><div><div class="en">'+esc(n)+'</div><div class="sub">'+(camps.length?camps.length+' campaña'+(camps.length>1?'s':''):'Sin campañas asignadas')+'</div></div></div>'+
      '<div class="er"><span>Estaciones registradas</span><b>'+hechas+'</b></div><div class="er"><span>Sin motivo</span><b style="color:'+(prob?'var(--rojo)':'inherit')+'">'+prob+'</b></div>'+
      '<div class="er"><span>Documentos completados</span><b>'+docs+'</b></div><div class="er"><span>Último registro</span><b>'+(ult?fmtD(ult):'—')+'</b></div><div class="er"><span>Próximo terreno</span><b>'+(prox?fmtD(prox):'—')+'</b></div></div>';
  }).join('')+'</div>';
}

// ─── NUEVA CAMPAÑA ───────────────────────────────────────
var draft=null;
function fechaSugerida(per,y){
  var ms=mesesPeriodo(per), mh=HOY.getMonth()+1;
  if(y===HOY.getFullYear()&&ms.indexOf(mh)>=0){ var d=new Date(HOY); d.setDate(d.getDate()+2); return iso(d); }
  return y+'-'+pad(ms[0]||1)+'-10';
}
function perPorDefecto(p,y){ var mh=HOY.getMonth()+1;
  return p.periodos.filter(function(x){ return mesesPeriodo(x).indexOf(mh)>=0; })[0] || p.periodos.filter(function(x){ return (mesesPeriodo(x)[0]||0)>mh; })[0] || p.periodos[0] || ''; }
function abrirNueva(pid,per,anio){
  pid=pid||Object.keys(MATRIZ)[0]; if(!pid){ toast('La matriz no tiene proyectos'); return; }
  var p=MATRIZ[pid], y=anio||(S.vista==='anio'?S.anio:HOY.getFullYear()); per=per||perPorDefecto(p,y);
  var d1=fechaSugerida(per,y), jefe=PERSONAL.indexOf(p.responsable)>=0?p.responsable:PERSONAL[0];
  draft={proyecto:pid,anio:y,periodo:per,ini:d1,fin:d1,jefe:jefe,equipo:[jefe]};
  renderNueva(); document.getElementById('sp').classList.add('on'); document.getElementById('ov').classList.add('on');
}
function cerrarNueva(){ document.getElementById('sp').classList.remove('on'); document.getElementById('ov').classList.remove('on'); }
function renderNueva(){
  var p=MATRIZ[draft.proyecto], ms=monsDe(draft.proyecto,draft.periodo), nT=0, nM=0;
  ms.forEach(function(m){ nT+=m.estaciones.length; nM+=m.estaciones.length*m.total; });
  var per=p.periodos.map(function(s){return '<option'+(draft.periodo===s?' selected':'')+'>'+esc(s)+'</option>';}).join('');
  var existe=getC(nuevaCampana(draft.proyecto,draft.anio,draft.periodo,draft.ini,draft.fin,draft.jefe,draft.equipo).id);
  document.getElementById('sp').innerHTML='<div class="sph"><div class="spt">＋ Nueva campaña</div><div class="sub">El checklist por estación se genera desde la matriz maestra</div></div>'+
    '<form class="spb" id="f-nueva">'+
    '<label class="fl">Proyecto<select class="sel" id="n-proy">'+Object.keys(MATRIZ).map(function(k){return '<option value="'+k+'"'+(k===draft.proyecto?' selected':'')+'>'+esc(MATRIZ[k].nombre)+'</option>';}).join('')+'</select></label>'+
    '<div class="f2"><label class="fl">Año<input class="inp" id="n-anio" type="number" value="'+draft.anio+'"></label><label class="fl">Periodo<select class="sel" id="n-per">'+per+'</select></label></div>'+
    '<div class="f2"><label class="fl">Fecha de inicio<input class="inp" id="n-ini" type="date" value="'+draft.ini+'"></label><label class="fl">Fecha de término<input class="inp" id="n-fin" type="date" value="'+draft.fin+'"></label></div>'+
    '<label class="fl">Jefe de terreno<select class="sel" id="n-jefe">'+PERSONAL.map(function(n){return '<option'+(n===draft.jefe?' selected':'')+'>'+esc(n)+'</option>';}).join('')+'</select></label>'+
    '<div class="fl">Equipo<div class="team">'+PERSONAL.map(function(n,i){return '<label><input class="chk" type="checkbox" id="n-eq-'+i+'" data-eq="'+esc(n)+'"'+(draft.equipo.indexOf(n)>=0?' checked':'')+'>'+esc(n)+'</label>';}).join('')+'</div></div>'+
    '<div class="prev"><b>Monitoreos de '+esc(draft.periodo)+' según la matriz:</b><ul>'+ms.map(function(m){return '<li><b>'+esc(m.nombre)+'</b>: '+(m.estaciones[0]==='GENERAL'?'sin estaciones (área general)':m.estaciones.length+' estaciones')+' · '+esc(resumenMon(m))+'</li>';}).join('')+'</ul>'+
      '<div><b>'+nT+'</b> estaciones a marcar (monitoreo × estación), <b>'+nM+'</b> muestras y mediciones en total, y <b>'+DOCS.length+'</b> documentos.</div>'+
      (existe?'<div class="warnline">Ya existe la campaña de '+esc(draft.periodo)+' '+draft.anio+' para este proyecto.</div>':'')+'</div>'+
    '</form><div class="spf"><button class="btn-p" id="n-crear">Crear campaña</button><button class="btn-s" id="n-cancelar">Cancelar</button></div>';
}

// ─── NAVEGACIÓN Y RENDER ─────────────────────────────────
function irTab(tab){
  S.tab=tab;
  document.querySelectorAll('.nav button').forEach(function(b){ b.setAttribute('aria-selected', String(b.dataset.tab===tab)); });
  ['calendario','campanas','detalle','pendientes','equipo'].forEach(function(k){ document.getElementById('tc-'+k).classList.toggle('on',k===tab); });
  render();
}
function render(){
  pintarNet(); renderAlertas();
  ({calendario:renderCalendario,campanas:renderCampanas,detalle:renderDetalle,pendientes:renderPendientes,equipo:renderEquipo})[S.tab]();
}
function pintarNota(){
  var n=document.getElementById('demo-note'), np=Object.keys(MATRIZ).length;
  n.innerHTML='<b>Modo prueba.</b> '+np+' proyecto'+(np!==1?'s':'')+' de la matriz maestra'+(MATRIZ_FECHA?' (exportada el '+esc(MATRIZ_FECHA)+')':'')+': '+Object.keys(MATRIZ).map(function(k){return esc(MATRIZ[k].nombre);}).join(', ')+
    '. Lo que registres se guarda solo en este navegador hasta conectar la planilla de Drive. <button type="button" class="lnk" id="borrar-pruebas">Borrar registros de prueba</button>';
  n.hidden=!DEMO;
}
function abrir(id,sub,foco){ if(S.tab!=='detalle') S.prevTab=S.tab; S.cid=id; S.sub=sub||'muestreo'; S.open={}; S.dataOpen=null; S.foco=null; S.ficha=null; S.verPend=false; S.mon=null; if(foco){ var t=getC(id).tareas.filter(function(x){return x.id===foco;})[0]; if(t){ S.mon=t.mon; S.ficha=t.id; } } irTab('detalle'); if(!foco) window.scrollTo(0,0); }
var tt; function toast(m){ var el=document.getElementById('toast'); el.textContent=m; el.classList.add('on'); clearTimeout(tt); tt=setTimeout(function(){el.classList.remove('on');},2600); }
function sello(t,c){ if(!t.fecha){ var n=new Date(); t.fecha=iso(n); t.hora=pad(n.getHours())+':'+pad(n.getMinutes()); } if(!t.resp&&c.equipo.indexOf(usuario)>=0) t.resp=usuario; }
function guardarTarea(c,t){ enviar('tarea',{campana:c.id,id:t.id,monitoreo:t.mon,estacion:t.est,estado:t.estado,responsable:t.resp,fecha:t.fecha,hora:t.hora,motivo:t.motivo,datos:t.datos}); }
function guardarDoc(c,d){ enviar('documento',{campana:c.id,documento:d.n,tipo:d.t,estado:d.estado,responsable:d.resp,fecha:d.fecha,ruta:d.ruta}); }

var selU=document.getElementById('usuario');

var ZOOM=[0.85,1,1.15,1.3], zi=1; try{ var zs=parseInt(localStorage.getItem('ceamar_terreno_zoom')); if(zs>=0&&zs<ZOOM.length) zi=zs; }catch(e){}
function aplicarZoom(){ document.getElementById('wrap').style.zoom=ZOOM[zi]; try{localStorage.setItem('ceamar_terreno_zoom',zi);}catch(e){} }
document.getElementById('z-menos').addEventListener('click',function(){ zi=Math.max(0,zi-1); aplicarZoom(); });
document.getElementById('z-mas').addEventListener('click',function(){ zi=Math.min(ZOOM.length-1,zi+1); aplicarZoom(); });
function tema(){ return document.documentElement.getAttribute('data-theme')||'light'; }
function pintarTema(){ document.getElementById('dark-btn').textContent=tema()==='dark'?'☀️':'🌙'; }
document.getElementById('dark-btn').addEventListener('click',function(){ var t=tema()==='dark'?'light':'dark'; document.documentElement.setAttribute('data-theme',t); try{localStorage.setItem('ceamar_terreno_tema',t);}catch(e){} pintarTema(); });
try{ var tg=localStorage.getItem('ceamar_terreno_tema'); if(tg) document.documentElement.setAttribute('data-theme',tg); }catch(e){}

var W=document.getElementById('wrap');
W.addEventListener('click',function(e){
  if(e.target.dataset&&e.target.dataset.cerrarFicha){ S.ficha=null; S.dataOpen=null; renderDetalle(); return; }
  var b=e.target.closest('button'); if(!b) return;
  if(b.id==='np-abrir'){ abrirNueva(); return; }
  if(b.id==='borrar-pruebas'){ if(!CAMP.length){ toast('No hay registros de prueba'); return; } if(!confirm('¿Borrar las '+CAMP.length+' campañas de prueba guardadas en este navegador?')) return; CAMP=[]; guardarCamp(); S.cid=null; irTab('calendario'); toast('Registros de prueba borrados'); return; }
  if(b.dataset.vista){ S.vista=b.dataset.vista; renderCalendario(); return; }
  if(b.dataset.nav!=null){ var n=+b.dataset.nav;
    if(S.vista==='estacion'){ if(n===0) S.est=[HOY.getFullYear(),Math.floor(HOY.getMonth()/3)]; else { var k=S.est[0]*4+S.est[1]+n; S.est=[Math.floor(k/4),k%4]; } }
    else if(S.vista==='mes'){ if(n===0) S.ym=[HOY.getFullYear(),HOY.getMonth()]; else { var d=new Date(S.ym[0],S.ym[1]+n,1); S.ym=[d.getFullYear(),d.getMonth()]; } }
    else S.anio = n===0 ? HOY.getFullYear() : S.anio+n;
    render(); return; }
  if(b.dataset.filtro){ S.filtro=b.dataset.filtro; renderCampanas(); return; }
  if(b.dataset.prog){ if(!esCoord()){ toast('Solo coordinación programa campañas'); return; } var pm=b.dataset.prog.split('|'); abrirNueva(pm[0],pm[1],+pm[2]||0); return; }
  if(b.dataset.irEst){ var cid=CAMP.filter(function(c){return c.tareas.some(function(t){return t.id===b.dataset.irEst;});})[0].id; abrir(cid,'muestreo',b.dataset.irEst); return; }
  if(b.dataset.abrir){ abrir(b.dataset.abrir,b.dataset.sub); return; }
  if(b.dataset.mon){ S.mon=b.dataset.mon; S.ficha=null; renderDetalle(); if(window.innerWidth<760){ var hd=document.querySelector('.ck'); if(hd&&hd.getBoundingClientRect().top<0) hd.scrollIntoView({behavior:'smooth',block:'start'}); } return; }
  if(b.dataset.verpend!=null){ S.verPend=b.dataset.verpend==='1'; renderDetalle(); return; }
  if(b.id==='ficha-cerrar'){ S.ficha=null; S.dataOpen=null; renderDetalle(); return; }
  if(b.dataset.irMon){ S.open[b.dataset.irMon]=true; renderDetalle(); var g=document.querySelector('details[data-m="'+b.dataset.irMon+'"]'); if(g) g.scrollIntoView({behavior:'smooth',block:'start'}); return; }
  if(b.id==='volver'){ irTab(S.prevTab||'calendario'); return; }
  if(b.dataset.sub&&S.tab==='detalle'){ S.sub=b.dataset.sub; S.foco=null; renderDetalle(); return; }
  var c=getC(S.cid); if(!c) return;
  var row=b.closest('[data-t]');
  if(row){ var t=c.tareas.filter(function(x){return x.id===row.dataset.t;})[0], act=b.dataset.act; S.foco=null;
    if(act==='estado'){ t.estado=t.estado===b.dataset.v?'':b.dataset.v; if(t.estado) sello(t,c); guardarTarea(c,t); render(); return; }
    if(act==='ficha'){ S.ficha=t.id; renderDetalle(); return; }
    if(act==='datos'){ S.dataOpen=S.dataOpen===t.id?null:t.id; renderDetalle(); return; }
  }
  var dr=b.closest('[data-d]');
  if(dr){ var dd=c.docs[+dr.dataset.d];
    if(b.dataset.act==='doc'){ dd.estado=b.dataset.o==='Completo'?'Completo':''; if(dd.estado&&!dd.fecha) dd.fecha=HOY_S; if(dd.estado&&!dd.resp&&c.equipo.indexOf(usuario)>=0) dd.resp=usuario; guardarDoc(c,dd); render(); return; }
    if(b.dataset.act==='copiar'){ var inp=dr.querySelector('[data-f=ruta]'); if(!inp.value){ toast('No hay ruta para copiar'); return; }
      try{ navigator.clipboard.writeText(inp.value).then(function(){toast('Ruta copiada');},function(){inp.select();toast('Selecciona y copia la ruta');}); }catch(x){ inp.select(); toast('Selecciona y copia la ruta'); } } }
});
W.addEventListener('toggle',function(e){ var g=e.target.closest&&e.target.closest('details[data-m]'); if(g) S.open[g.dataset.m]=g.open; },true);
W.addEventListener('change',function(e){
  var el=e.target, c=getC(S.cid); if(!c||S.tab!=='detalle') return;
  var row=el.closest('[data-t]');
  if(row){ var t=c.tareas.filter(function(x){return x.id===row.dataset.t;})[0], m=mOf(c,t.mon), f=el.dataset.f;
    if(f==='resp') t.resp=el.value;
    else if(f==='fecha'){ t.fecha=el.value; if(!el.value) t.hora=''; }
    else if(f==='motivo') t.motivo=el.value;
    else if(f==='ok'||f==='cnt'){ var dk=f==='ok'?'ok':'cnt'; t.datos[dk]=t.datos[dk]||{};
      if(f==='ok') t.datos.ok[el.dataset.k]=el.checked; else t.datos.cnt[el.dataset.k]=el.value===''?'':Math.max(0,+el.value);
      var it=m.items.filter(function(x){return x.k===el.dataset.k.split('|')[0];})[0];
      if(it&&it.med&&el.checked){ t.datos.hora=t.datos.hora||{}; if(!t.datos.hora[it.k]){ var nn=new Date(); t.datos.hora[it.k]=pad(nn.getHours())+':'+pad(nn.getMinutes()); } }
      var got=contar(m,t.datos); if(got){ t.estado=got>=m.total?'Realizado':'Parcial'; sello(t,c); } }
    else if(f==='hora'){ t.datos.hora=t.datos.hora||{}; t.datos.hora[el.dataset.k]=el.value; }
    guardarTarea(c,t); render(); return; }
  var dr=el.closest('[data-d]');
  if(dr){ var d=c.docs[+dr.dataset.d]; if(el.dataset.f==='dresp') d.resp=el.value; if(el.dataset.f==='ruta') d.ruta=el.value.trim(); guardarDoc(c,d); render(); }
});
var SP=document.getElementById('sp');
document.getElementById('ov').addEventListener('click',cerrarNueva);
SP.addEventListener('submit',function(e){ e.preventDefault(); });
SP.addEventListener('change',function(e){ var el=e.target;
  if(el.id==='n-proy'){ draft.proyecto=el.value; draft.periodo=perPorDefecto(MATRIZ[el.value],draft.anio); draft.ini=draft.fin=fechaSugerida(draft.periodo,draft.anio); }
  if(el.id==='n-per'){ draft.periodo=el.value; draft.ini=draft.fin=fechaSugerida(el.value,draft.anio); } if(el.id==='n-anio') draft.anio=+el.value; if(el.id==='n-ini'){ draft.ini=el.value; if(draft.fin<el.value) draft.fin=el.value; } if(el.id==='n-fin') draft.fin=el.value;
  if(el.id==='n-jefe'){ draft.jefe=el.value; if(draft.equipo.indexOf(el.value)<0) draft.equipo.push(el.value); }
  if(el.dataset.eq){ var n=el.dataset.eq; draft.equipo=el.checked?draft.equipo.concat(draft.equipo.indexOf(n)<0?[n]:[]):draft.equipo.filter(function(x){return x!==n;}); }
  renderNueva(); });
SP.addEventListener('click',function(e){ var b=e.target.closest('button'); if(!b) return;
  if(b.id==='n-cancelar'){ cerrarNueva(); return; }
  if(b.id==='n-crear'){
    if(!draft.equipo.length){ toast('Elige al menos una persona para el equipo'); return; }
    if(!draft.periodo){ toast('Este proyecto no tiene periodos en la matriz'); return; }
    if(draft.fin<draft.ini){ toast('La fecha de término es anterior a la de inicio'); return; }
    var c=nuevaCampana(draft.proyecto,draft.anio,draft.periodo,draft.ini,draft.fin,draft.jefe,draft.equipo);
    if(getC(c.id)){ toast('Ya existe la campaña '+c.id); return; }
    CAMP.push(c); enviar('crearCampana',{id:c.id,proyecto:c.proyecto,anio:c.anio,periodo:c.periodo,inicio:c.ini,termino:c.fin,jefe:c.jefe,equipo:c.equipo});
    cerrarNueva(); abrir(c.id,'muestreo'); toast('Campaña creada: '+c.tareas.length+' tareas y '+c.docs.length+' documentos'); } });

// ─── INICIO ──────────────────────────────────────────────
aplicarZoom(); pintarTema();
function altoTop(){ var t=document.querySelector('.top'); if(t) document.documentElement.style.setProperty('--top-h',t.offsetHeight+'px'); }
altoTop(); window.addEventListener('resize',altoTop);
cargarMatriz().catch(function(){ toast('No se pudo leer la matriz en línea; se usa la copia exportada'); CONFIG.MATRIZ_ID=''; return cargarMatriz(); })
  .then(function(){ cargarCamp(); pintarNota(); render(); flush(); });
}
</script>
