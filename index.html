<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seguimiento de Terrenos CEAMAR</title>
<link rel="icon" type="image/png" href="logos/ceamar-favicon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1a5c2e">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Terrenos CEAMAR">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="preconnect" href="https://script.google.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Montserrat:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* VOICE: herramienta de terreno de CEAMAR; colores de la página de informes, estructura propia de muestreo.
     IDEA: la libreta de terreno: calendario de campañas y, dentro de cada una, la grilla estación × día.
     PICTURE: calendario (mes / año por proyecto) y grilla de estaciones con lo muestreado cada día.
     COLOUR/TYPE: verde #1a5c2e y azul #0d3d5c de CEAMAR; DM Sans.
     LAYOUT: barra blanca fija con pestañas subrayadas; contenido hasta 1300px; una columna en celular. */
  :root,[data-theme="light"]{
    --verde:#1a5c2e;--verde-s:#e8f5e9;--azul:#0d3d5c;--azul-c:#1565c0;--azul-s:#e3f2fd;
    --amber:#e65100;--amber-s:#fff3e0;--rojo:#c62828;--rojo-s:#ffebee;
    --gris:#f4f6f8;--borde:#e0e0e0;--texto:#1a1a2e;--suave:#6b7280;
    --sombra:0 2px 14px rgba(0,0,0,0.07);--sombra-hover:0 8px 28px rgba(0,0,0,0.13);
    --r:14px;--bg:#f0f4f8;--card-bg:#ffffff;color-scheme:light;
  }
  [data-theme="dark"]{
    --verde:#4caf50;--verde-s:#1b3a20;--azul:#90caf9;--azul-c:#64b5f6;--azul-s:#0d2137;
    --amber:#ffb74d;--amber-s:#2d1f00;--rojo:#ef5350;--rojo-s:#2d0e0e;
    --gris:#1e2736;--borde:#2d3a4a;--texto:#e2e8f0;--suave:#94a3b8;
    --sombra:0 2px 14px rgba(0,0,0,0.35);--sombra-hover:0 8px 28px rgba(0,0,0,0.5);
    --bg:#0f1623;--card-bg:#1a2333;color-scheme:dark;
  }
  *{box-sizing:border-box;margin:0;padding:0;min-width:0;}
  [hidden]{display:none!important;}
  html{background:var(--bg);}
  body{font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--texto);min-height:100vh;font-size:14px;overflow-x:clip;}
  button,input,select{font-family:inherit;font-size:inherit;color:inherit;}
  button{cursor:pointer;}
  :focus-visible{outline:3px solid var(--azul-c);outline-offset:2px;}
  .num{font-variant-numeric:tabular-nums;}

  /* BARRA SUPERIOR (blanca, propia de terreno) */
  .top{position:sticky;top:0;z-index:100;background:linear-gradient(135deg,#1a5c2e 0%,#0d3d5c 100%);box-shadow:0 4px 20px rgba(0,0,0,0.18);}
  .top-in{max-width:1300px;margin:0 auto;padding:14px 22px 0;}
  .top-row{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;}
  .brand{display:flex;align-items:center;gap:12px;margin-right:auto;}
  .brand-logo{background:#fff;border:none;border-radius:12px;padding:6px 14px;display:flex;align-items:center;flex-shrink:0;cursor:pointer;transition:transform .15s,box-shadow .15s;}
  .brand-logo:hover{transform:translateY(-1px);box-shadow:0 4px 14px rgba(0,0,0,.25);}
  .brand img{height:46px;width:auto;display:block;}
  .brand-t{font-family:'Montserrat','DM Sans',sans-serif;font-size:27px;color:#fff;line-height:1.1;letter-spacing:.2px;padding-left:16px;border-left:2px solid rgba(255,255,255,.35);text-shadow:0 1px 2px rgba(0,0,0,.18);font-weight:500;}
  .brand-s{font-size:11px;color:rgba(255,255,255,0.65);margin-top:3px;}
  .ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .pillbtn,.selu{border:1px solid rgba(255,255,255,0.22);background:rgba(255,255,255,0.12);color:#fff;border-radius:20px;padding:6px 12px;font-size:12px;font-weight:600;}
  .selu option{color:#1a1a2e;background:#fff;}
  .zoom{display:flex;border:1px solid rgba(255,255,255,0.22);border-radius:20px;overflow:hidden;}
  .zoom button{border:none;background:rgba(255,255,255,0.12);color:#fff;padding:6px 10px;font-weight:700;font-size:12px;}
  .zoom button+button{border-left:1px solid rgba(255,255,255,0.22);}
  .net{display:inline-flex;align-items:center;gap:6px;}
  .net i{width:8px;height:8px;border-radius:50%;background:#4caf50;}
  .net.off{color:#ffcc80;border-color:#ffcc80;}.net.off i{background:#ffb74d;}
  .net.demo i{background:#90caf9;}
  .nav{display:flex;gap:8px;margin-top:14px;padding-bottom:14px;overflow-x:auto;}
  .nav button{border:1.5px solid rgba(255,255,255,0.35);background:rgba(255,255,255,0.12);padding:9px 20px;border-radius:999px;font-weight:700;font-size:15px;color:#fff;white-space:nowrap;cursor:pointer;transition:background .15s,transform .15s,box-shadow .15s;}
  .nav button:hover{background:rgba(255,255,255,0.24);transform:translateY(-1px);}
  .nav button[aria-selected="true"]{background:#fff;color:#1a5c2e;border-color:#fff;box-shadow:0 3px 10px rgba(0,0,0,.2);}

  .wrap{max-width:1300px;margin:0 auto;padding:20px 22px 40px;}
  .tc{display:none;}.tc.on{display:block;}
  .demo-note{font-size:12px;color:var(--suave);background:var(--card-bg);border:1px dashed var(--borde);border-radius:8px;padding:8px 12px;margin-bottom:16px;}
  .alertas{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
  .alerta{display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:10px;font-size:12px;font-weight:500;flex:1;min-width:230px;border:none;text-align:left;}
  .alerta b{font-size:15px;}
  .alerta-rojo{background:var(--rojo-s);border:1px solid #ef9a9a;color:var(--rojo);}
  .alerta-amber{background:var(--amber-s);border:1px solid #ffcc80;color:var(--amber);}
  .alerta-verde{background:var(--verde-s);border:1px solid #a5d6a7;color:var(--verde);}
  [data-theme="dark"] .alerta{border-color:transparent;}
  .h1{font-size:22px;font-weight:800;color:var(--azul);}
  .sub{font-size:12px;color:var(--suave);}
  .bar-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px;}
  .spacer{margin-left:auto;}
  .seg{display:inline-flex;border:1px solid var(--borde);border-radius:20px;overflow:hidden;background:var(--card-bg);}
  .seg button{border:none;background:none;padding:6px 14px;font-size:12px;font-weight:600;color:var(--suave);}
  .seg button+button{border-left:1px solid var(--borde);}
  .seg button[aria-pressed="true"]{background:var(--verde);color:#fff;}
  .arrow{border:1px solid var(--borde);background:var(--card-bg);border-radius:20px;width:34px;height:34px;font-weight:700;}
  .btn-p{padding:8px 16px;border-radius:20px;border:none;background:var(--verde);color:white;font-weight:600;font-size:13px;}
  [data-theme="dark"] .btn-p,[data-theme="dark"] .seg button[aria-pressed="true"]{color:#0f1623;}
  .btn-s{padding:6px 12px;border-radius:20px;border:1px solid var(--borde);background:var(--card-bg);color:var(--suave);font-size:12px;font-weight:600;}
  .btn-s:hover{border-color:var(--verde);color:var(--verde);}
  .leyenda{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--suave);margin-bottom:12px;}
  .leyenda span{display:inline-flex;align-items:center;gap:5px;}
  .sw{width:12px;height:12px;border-radius:3px;display:inline-block;border:1.5px solid currentColor;}
  .nav button,.subnav button,.seg button,.zoom button{flex-shrink:0;}
  .net .sh{display:none;}

  /* ESTADOS (colores de informes) */
  .e-comp{background:var(--verde-s);color:var(--verde);}
  .e-terr{background:var(--amber-s);color:var(--amber);}
  .e-prog{background:var(--azul-s);color:var(--azul-c);}
  .e-pend{background:var(--rojo-s);color:var(--rojo);}
  .e-porp{background:transparent;color:var(--suave);border:1px dashed var(--suave);}
  .e-sinr{background:var(--rojo-s);color:var(--rojo);border:1px dashed var(--rojo);}

  /* CALENDARIO MENSUAL */
  .cal{background:var(--card-bg);border-radius:var(--r);box-shadow:var(--sombra);overflow:hidden;}
  .cal-head,.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));}
  .cal-head div{padding:8px 10px;font-size:11px;font-weight:700;color:var(--suave);text-transform:uppercase;letter-spacing:.4px;border-bottom:1px solid var(--borde);}
  .dia{min-height:112px;border-right:1px solid var(--borde);border-bottom:1px solid var(--borde);padding:6px;display:flex;flex-direction:column;gap:4px;}
  .dia:nth-child(7n){border-right:none;}
  .dia.fuera{background:var(--gris);}
  .dia.fuera .dnum{opacity:.45;}
  .dnum{font-size:12px;font-weight:700;color:var(--suave);}
  .dia.hoy .dnum{background:var(--verde);color:#fff;border-radius:10px;padding:1px 7px;width:fit-content;}
  .ev{border:none;text-align:left;border-radius:6px;padding:4px 6px;font-size:11px;font-weight:600;line-height:1.25;width:100%;}
  .ev small{display:block;font-weight:500;opacity:.85;}
  .agenda{display:none;}
  .avance{background:var(--card-bg);border-radius:var(--r);box-shadow:var(--sombra);padding:14px 16px;margin-bottom:16px;}
  .av-top{display:flex;align-items:center;gap:14px;margin-bottom:10px;}
  .av-big{font-size:34px;font-weight:800;color:var(--verde);line-height:1;}
  .av-row{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(80px,1fr) 70px;align-items:center;gap:12px;width:100%;border:none;background:none;text-align:left;padding:9px 4px;border-top:1px solid var(--borde);color:var(--texto);cursor:pointer;}
  .av-row:hover{background:var(--gris);}
  .av-nom b{font-size:13px;}
  .av-nom small{display:block;font-size:11px;color:var(--suave);margin-top:2px;}
  .av-row.listo .av-nom small{color:var(--verde);font-weight:700;}
  .av-row .pbar,.et-card .pbar{display:block;height:8px;border-radius:5px;background:var(--gris);overflow:hidden;}
  .av-row .pfill,.et-card .pfill{display:block;height:100%;background:var(--verde);border-radius:5px;}
  .av-num{text-align:right;font-size:11px;color:var(--suave);}
  .av-num b{display:block;font-size:14px;color:var(--texto);}
  .inp-f{width:auto;padding:4px 8px;}
  .en-terreno{display:grid;gap:8px;margin-bottom:14px;}
  .et-card{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card-bg);border:2px solid var(--amber);border-radius:var(--r);box-shadow:var(--sombra);padding:10px 14px;cursor:pointer;color:var(--texto);}
  .et-txt{flex:1;display:grid;gap:4px;}
  .et-txt small{font-size:11.5px;color:var(--suave);}
  .et-pct{font-size:22px;font-weight:800;color:var(--verde);text-align:right;}
  .et-pct small{display:block;font-size:11px;font-weight:700;color:var(--azul);}
  .ck{display:grid;grid-template-columns:280px minmax(0,1fr);gap:16px;align-items:start;}
  .ck-mons{position:sticky;top:140px;background:var(--card-bg);border-radius:var(--r);box-shadow:var(--sombra);padding:8px;display:grid;gap:2px;max-height:calc(100vh - 160px);overflow:auto;}
  .ck-total{display:grid;gap:4px;padding:8px 10px 12px;border-bottom:1px solid var(--borde);margin-bottom:4px;font-size:12px;color:var(--suave);}
  .ck-big{font-size:30px;font-weight:800;color:var(--verde);line-height:1;}
  .ck-mon{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 8px;align-items:center;width:100%;text-align:left;border:none;background:none;border-radius:10px;padding:9px 10px;color:var(--texto);cursor:pointer;}
  .ck-mon:hover{background:var(--gris);}
  .ck-mon.sel{background:var(--verde-s);box-shadow:inset 3px 0 0 var(--verde);}
  .ck-mn b{font-size:13px;display:block;}
  .ck-mn small{font-size:11px;color:var(--suave);}
  .ck-mon.listo .ck-mn small{color:var(--verde);font-weight:700;}
  .ck-pct{font-size:13px;font-weight:800;}
  .ck-mon .pbar,.ck-total .pbar{grid-column:1/-1;display:block;height:5px;border-radius:4px;background:var(--gris);overflow:hidden;}
  .ck-mon .pfill,.ck-total .pfill{display:block;height:100%;background:var(--verde);}
  .ck-main{background:var(--card-bg);border-radius:var(--r);box-shadow:var(--sombra);padding:14px 16px;scroll-margin-top:140px;}
  .ck-head{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-start;justify-content:space-between;margin-bottom:10px;}
  .ck-head>div:first-child{flex:1;min-width:200px;}
  .ck-tit{font-size:18px;font-weight:800;color:var(--azul);}
  .ck-cnt{font-size:13px;font-weight:700;color:var(--suave);margin-left:4px;}
  .ck-antes{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:flex-end;background:var(--gris);border-radius:10px;padding:10px 12px;margin-bottom:10px;}
  .ck-antes span{display:block;font-size:11px;font-weight:700;color:var(--suave);text-transform:uppercase;letter-spacing:.3px;margin-bottom:4px;}
  .ck-fecha .inp{width:auto;}
  .ck-resp{flex:1;min-width:220px;}
  .ck-chips{display:flex;flex-wrap:wrap;gap:6px;}
  .chip{border:1px solid var(--borde);background:var(--card-bg);border-radius:16px;padding:5px 11px;font-size:12px;font-weight:600;color:var(--texto);cursor:pointer;}
  .chip[aria-pressed="true"]{background:var(--verde);border-color:var(--verde);color:#fff;}
  .ck-antes .warnline{flex-basis:100%;margin:0;}
  .ck-clima{flex-basis:100%;border-top:1px dashed var(--borde);padding-top:10px;}
  .ck-clima .cl-g{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px 12px;margin-top:6px;}
  .ck-clima label{display:flex;flex-direction:column;gap:3px;font-size:12px;font-weight:700;color:var(--suave);}
  .ck-clima label.falta select{border-color:var(--rojo);}
  .ck-clima .cl-obs{grid-column:1/-1;}
  .ck-clima .cl-otros{margin-top:8px;font-size:12px;color:var(--suave);}
  .ck-redes{flex-basis:100%;border-top:1px dashed var(--borde);padding-top:10px;}
  .ck-redes .rd-l{display:flex;flex-wrap:wrap;gap:8px 14px;margin-top:8px;}
  .ck-redes .rd-i{display:flex;align-items:center;gap:6px;background:var(--card-bg);border:1px solid var(--borde);border-radius:10px;padding:5px 6px 5px 12px;}
  .ck-redes .rd-i b{font-size:13px;}
  .ck-redes .rd-i label{font-size:12px;color:var(--suave);display:flex;align-items:center;gap:6px;text-transform:none;letter-spacing:0;font-weight:600;margin:0;}
  .ck-redes .rd-i input{width:110px;padding:5px 8px;font-size:13px;}
  .btn-flujo{border:none;background:var(--verde);color:#fff;font-weight:700;font-size:12.5px;padding:6px 12px;border-radius:16px;cursor:pointer;margin-left:4px;}
  .btn-flujo:hover{background:#14532d;}
  .lote{flex-basis:100%;background:var(--card-bg);border:1px solid var(--borde);border-radius:8px;padding:8px 12px;font-size:13px;display:flex;flex-wrap:wrap;align-items:center;gap:8px;}
  .lote-btn{flex-basis:100%;margin:6px 0 18px;}
  .logo-txt{font-size:11px;font-weight:800;color:var(--azul);text-align:center;line-height:1.15;padding:4px;word-break:break-word;}
  /* Partes del muestreo */
  .tr-cab{margin:14px 0 6px;font-size:15px;}
  .tramo{border:1px solid var(--borde);border-radius:12px;padding:10px 12px;margin-bottom:10px;background:var(--card-bg);}
  .tramo-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
  .tr-mons{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:4px;}
  .tr-mons label{display:flex;align-items:center;gap:6px;font-size:13.5px;font-weight:600;}
  .tr-mons .tr-otro{opacity:.5;}
  .tr-todos{background:var(--verde-s,#eef6ef);border-radius:10px;padding:8px;border-top:none !important;}
  .tr-resp{margin-top:8px;padding-top:8px;border-top:1px dashed var(--borde);}
  .tr-rt{font-size:13px;font-weight:700;margin-bottom:5px;}
  .tr-rt .falta,.parte .falta{color:#b3261e;font-weight:700;font-style:normal;}
  .tr-chips{display:flex;flex-wrap:wrap;gap:5px;}
  .tr-libres{font-size:13px;margin:6px 0 10px;padding:8px 10px;border-radius:10px;background:var(--amber-s,#fff7e6);}
  .partes{display:flex;flex-direction:column;gap:6px;align-items:flex-start;}
  .parte{font-size:13.5px;}
  .parte-m{display:flex;flex-direction:column;gap:2px;margin:3px 0 0 12px;font-size:13px;}
  .parte-libre{color:var(--suave);}
  /* Registros SSO */
  .sso-sec{font-size:15px;margin:16px 0 8px;}
  .sso-sec .sub{font-weight:600;}
  .sso-firmar{margin-top:14px;padding:12px 14px;border:2px solid var(--verde);border-radius:12px;background:var(--verde-s,#eef6ef);}
  .sso-firmar.off{border-style:dashed;border-color:var(--borde);background:transparent;}
  .sso-firmar p{margin:6px 0;}
  .sso-pin{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin-top:8px;}
  .sso-pin label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:700;color:var(--suave);}
  .sso-pin input{width:130px;font-size:20px;letter-spacing:6px;text-align:center;}
  .sso-firmado{padding:10px 14px;border-radius:12px;background:var(--verde-s,#eef6ef);border:1px solid var(--verde);margin-bottom:12px;display:flex;flex-direction:column;gap:4px;}
  .sso-firmado code{font-weight:800;letter-spacing:1px;}
  .sso-firmado span{font-size:12px;color:var(--suave);}
  .sso-anular{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:6px;}
  .sso-anular .inp{flex:1;min-width:220px;}
  .btn-p.sso-rojo{background:#b3261e;border-color:#b3261e;}
  .sso-anulada{margin:4px 0;}
  .eqc-pin{margin-top:6px;font-size:12px;}
  .sso-pfs{border-style:solid;}
  .sso-pf{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:7px 0;border-top:1px solid var(--borde);}
  .sso-pfn{flex:1;min-width:160px;font-weight:700;font-size:13.5px;}
  .sso-pf .sso-pin{margin:0;}
  .sso-pf .sso-pin input{width:120px;font-size:18px;}
  .sso-acred{margin:-4px 0 10px;}
  .sso-dias{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;}
  .sso-dias button{flex:0 0 auto;border:1px solid var(--borde);background:var(--card-bg);border-radius:12px;padding:6px 12px;font:inherit;font-size:13px;font-weight:700;color:var(--texto);cursor:pointer;display:flex;flex-direction:column;align-items:center;line-height:1.2;}
  .sso-dias button small{font-size:11px;font-weight:600;color:var(--suave);}
  .sso-dias button[aria-selected="true"]{background:var(--verde);border-color:var(--verde);color:#fff;}
  .sso-dias button[aria-selected="true"] small{color:rgba(255,255,255,.85);}
  .sso-cab{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px;}
  .sso-c{border:1px solid var(--borde);border-radius:12px;margin-bottom:8px;background:var(--card-bg);}
  .sso-c.abierto{border-color:var(--verde);box-shadow:0 2px 10px rgba(0,0,0,.06);}
  .sso-ch{display:flex;align-items:center;gap:10px;padding:10px 12px;flex-wrap:wrap;}
  .sso-tit{flex:1;min-width:180px;border:none;background:none;text-align:left;font:inherit;cursor:pointer;color:var(--texto);padding:0;display:flex;flex-direction:column;}
  .sso-tit small{font-size:11px;color:var(--suave);font-weight:600;letter-spacing:.3px;}
  .sso-acc{display:flex;align-items:center;gap:8px;}
  .badge.sso-na{background:var(--gris);color:var(--suave);}
  .badge.sso-vacio{background:var(--gris);color:var(--suave);border:1px dashed var(--borde);}
  .sso-b{border-top:1px solid var(--borde);padding:12px;}
  .sso-hf{margin-bottom:12px;}
  .sso-hf .sso-ancho{grid-column:1/-1;}
  .sso-hf textarea{resize:vertical;font:inherit;}
  .sso-g{margin:12px 0;}

  .est-cab.se-otono{--ec:#9a3412;--eb:#fbede4;}
  .est-cab.se-invierno{--ec:#1d4ed8;--eb:#e6eefc;}
  .est-ico{width:54px;height:54px;border-radius:14px;background:var(--eb);color:var(--ec);display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.04);}
  .est-ico svg{width:30px;height:30px;}
  .est-nom{font-family:'Montserrat','DM Sans',sans-serif;font-size:30px;font-weight:700;color:var(--ec);line-height:1.1;letter-spacing:-.2px;}
  .est-nom span{font-weight:500;opacity:.85;}
  .est-mes{font-size:12px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--suave);margin-top:3px;}
  [data-theme="dark"] .est-cab{--eb:rgba(255,255,255,.08);}
  [data-theme="dark"] .est-cab.se-primavera{--ec:#6fcf8f;}[data-theme="dark"] .est-cab.se-verano{--ec:#f5c04a;}[data-theme="dark"] .est-cab.se-otono{--ec:#f0a070;}[data-theme="dark"] .est-cab.se-invierno{--ec:#8fb4ff;}
  .temporada .ico-est{width:20px;height:20px;}
  .trim{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;}
  .mm{background:var(--card-bg);border-radius:var(--r);box-shadow:var(--sombra);padding:12px 12px 10px;}
  .mm-t{font-size:15px;font-weight:700;color:var(--azul);margin-bottom:8px;}
  .mm-h,.mm-g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;}
  .mm-h div{font-size:10px;font-weight:700;color:var(--suave);text-align:center;padding-bottom:4px;}
  .md{min-height:58px;border-radius:7px;background:var(--gris);padding:3px;display:flex;flex-direction:column;gap:2px;}
  .md.vacio{background:none;}
  .mdn{font-size:11px;font-weight:700;color:var(--suave);padding-left:2px;}
  .md.hoy{outline:2px solid var(--verde);}
  .md.hoy .mdn{color:var(--verde);}
  .mev{border:none;border-radius:4px;padding:2px 3px;font-size:9.5px;font-weight:700;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%;}
  .est-lista{margin-top:14px;background:var(--card-bg);border-radius:var(--r);box-shadow:var(--sombra);padding:12px 14px;}
  .est-it{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;width:100%;border:none;background:none;text-align:left;padding:8px 4px;border-top:1px solid var(--borde);font-size:13px;color:var(--texto);}
  .est-it span{font-size:12px;color:var(--suave);}
  .est-it .badge{margin-left:auto;}
  .ag-dia{background:var(--card-bg);border-radius:10px;box-shadow:var(--sombra);padding:10px 12px;margin-bottom:8px;display:grid;gap:6px;}
  .ag-dia.hoy{outline:2px solid var(--verde);}
  .ag-f{font-size:12px;font-weight:700;color:var(--suave);}

  /* CALENDARIO ANUAL (proyectos × meses) */
  .twrap{overflow-x:auto;}
  .anual{width:100%;border-collapse:separate;border-spacing:0;background:var(--card-bg);border-radius:var(--r);box-shadow:var(--sombra);font-size:12px;}
  .anual th{font-size:10px;font-weight:700;color:var(--suave);text-transform:uppercase;padding:9px 6px;border-bottom:1px solid var(--borde);text-align:center;white-space:nowrap;}
  .anual th.mes-act{color:var(--verde);}
  .anual td{padding:6px 4px;border-bottom:1px solid var(--borde);text-align:center;}
  .anual tr:last-child td{border-bottom:none;}
  .anual td.pcol,.anual th.pcol{position:sticky;left:0;background:var(--card-bg);text-align:left;padding:8px 12px;z-index:1;min-width:210px;}
  .pcell{display:flex;align-items:center;gap:10px;}
  .pcell img{width:44px;height:26px;object-fit:contain;background:#fff;border-radius:5px;padding:2px;}
  .pname{font-weight:700;color:var(--azul);font-size:13px;}
  .pfrec{font-size:10px;color:var(--suave);}
  .mc{border:none;border-radius:6px;width:100%;min-width:58px;padding:6px 2px;font-size:10px;font-weight:700;line-height:1.2;}
  .mc.vacio{background:none;color:var(--borde);cursor:default;}
  .mc b{font-size:11px;}
  .mc small{display:block;font-weight:600;font-size:9.5px;opacity:.85;margin-top:2px;}
  .e-prev{display:block;background:var(--gris);color:var(--suave);border:1px solid var(--borde);cursor:default;}
  .anual td.slot{padding:6px 5px;}
  .anual tr.fila-anual td{border-top:none;padding-top:0;}
  .anual tr.fila-anual .mc{max-width:520px;margin:0 auto;}
  .anual td.slot.act{background:var(--verde-s);}
  .mcods{font-size:9.5px;color:var(--suave);margin-top:4px;line-height:1.3;white-space:normal;}

  /* KPIs y tarjetas de campaña */
  .kgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:16px;}
  .kpi{background:var(--card-bg);border-radius:var(--r);padding:16px 18px;box-shadow:var(--sombra);border-left:3px solid transparent;}
  .kpi.v{border-left-color:var(--verde)}.kpi.a{border-left-color:var(--azul-c)}.kpi.am{border-left-color:var(--amber)}.kpi.r{border-left-color:var(--rojo)}.kpi.t{border-left-color:var(--azul)}
  .klabel{font-size:11px;color:var(--suave);font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;}
  .kval{font-size:28px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;}
  .ksub{font-size:12px;color:var(--suave);margin-top:4px;}
  .franja{display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:var(--card-bg);border-radius:var(--r);box-shadow:var(--sombra);padding:10px 14px;margin-bottom:14px;}
  .franja-t{font-size:12px;font-weight:700;color:var(--suave);margin-right:4px;}
  .tocas{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}
  .toca{border-radius:8px;padding:6px 10px;font-size:12px;font-weight:700;text-align:left;line-height:1.25;}
  button.toca{cursor:pointer;}
  .toca small{display:block;font-size:10.5px;font-weight:600;opacity:.85;}
  .pcard3{display:flex;flex-direction:column;align-items:stretch;gap:12px;cursor:default;padding:18px;}
  .pcard3>*{width:100%;}
  .ccard.pcard3:hover{transform:none;box-shadow:var(--sombra);}
  .pc-h{display:flex;gap:12px;align-items:center;}
  .pc-h .logo{width:56px;height:56px;flex:0 0 auto;}
  .pc-tt{min-width:0;}.pc-tt .cname{font-size:18px;line-height:1.2;}
  .pc-sub{font-size:13px;color:var(--suave);margin-top:2px;}
  .pc-stats{display:flex;gap:8px;flex-wrap:wrap;}
  .pc-stats span{background:var(--gris);border-radius:20px;padding:4px 11px;font-size:12.5px;color:var(--texto);}
  .pc-stats b{font-size:14px;color:var(--azul);}
  .pc-stats .pc-frec{background:var(--verde-s);color:var(--verde);font-weight:700;}
  .pc-mons{display:flex;flex-wrap:wrap;gap:5px;}
  .pm{font-size:11.5px;padding:3px 9px;border-radius:12px;border:1px solid var(--borde);color:var(--texto);background:var(--card-bg);}
  .pm .pm-n{color:var(--suave);}
  .pc-plan{border-top:1px solid var(--borde);padding-top:10px;}
  .pc-lbl{font-size:11px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--suave);margin-bottom:7px;}
  .pc-tl{display:grid;grid-template-columns:repeat(auto-fit,minmax(76px,1fr));gap:6px;}
  .pt.e-prog .pt-i,.pt.e-terr .pt-i,.pt.e-pend .pt-i,.pt.e-comp .pt-i{display:none;}
  .pt{display:flex;align-items:center;gap:6px;border-radius:10px;padding:7px 7px;text-align:left;border:1px solid transparent;font:inherit;line-height:1.2;}
  button.pt{cursor:pointer;}button.pt:hover{filter:brightness(.97);box-shadow:0 2px 8px rgba(0,0,0,.08);}
  .pt-i{width:18px;height:18px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;background:rgba(0,0,0,.06);}
  .pt-t{min-width:0;}.pt-t b{display:block;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}.pt-t small{display:block;font-size:10.5px;opacity:.85;}
  .pt.e-prev{background:var(--gris);color:var(--suave);}
  .pt.e-porp{border:1px solid #b9d4f1;color:var(--azul-c);background:var(--azul-s);}
  .pt.e-porp .pt-i{display:none;}
  .pt.e-porp small{font-weight:700;}
  button.pt.e-porp:hover{background:#d4e8fb;border-color:var(--azul-c);filter:none;}
  .pt.e-sinr{border:1.5px dashed var(--rojo);color:var(--rojo);background:var(--rojo-s);}
  .pt.e-sinr .pt-i{background:var(--rojo);color:#fff;}
  .pt.pt-act{box-shadow:0 0 0 2px var(--verde-s);}
  .pc-ley{text-transform:none;letter-spacing:0;font-weight:500;}
  .pc-foot{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--suave);}
  .pc-foot .av{width:26px;height:26px;font-size:10.5px;}
  .pc-foot b{color:var(--texto);}
  .pcard2{display:flex;gap:14px;align-items:flex-start;cursor:default;}
  .ccard.pcard2:hover{transform:none;box-shadow:var(--sombra);}
  .cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,360px),1fr));gap:16px;}
  .ccard{background:var(--card-bg);border-radius:var(--r);padding:16px;box-shadow:var(--sombra);border:none;text-align:left;width:100%;transition:transform .2s,box-shadow .2s;display:flex;gap:14px;align-items:flex-start;}
  .ccard:hover{transform:translateY(-3px);box-shadow:var(--sombra-hover);}
  .logo{width:72px;min-height:64px;flex-shrink:0;display:flex;align-items:center;justify-content:center;border-radius:12px;background:#fff;border:1px solid var(--borde);padding:8px;}
  .logo img{max-width:56px;max-height:44px;object-fit:contain;}
  .cname{font-size:16px;font-weight:700;color:var(--azul);line-height:1.25;}
  .cmeta{font-size:11px;color:var(--suave);margin:3px 0 8px;}
  .badge{display:inline-block;font-size:10px;font-weight:700;padding:2px 8px;border-radius:12px;margin-left:6px;vertical-align:2px;}
  .prow{display:grid;grid-template-columns:78px minmax(0,1fr) 40px;align-items:center;gap:8px;margin-bottom:5px;font-size:11px;color:var(--suave);font-weight:600;}
  .pbar{height:8px;background:var(--gris);border-radius:5px;overflow:hidden;}
  .pfill{height:100%;border-radius:5px;background:var(--verde);}
  .pfill.doc{background:var(--azul-c);}
  .ppct{font-size:13px;font-weight:800;text-align:right;font-variant-numeric:tabular-nums;color:var(--texto);}
  .cfoot{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:8px;}
  .avs{display:flex;margin-right:4px;}
  .av{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:700;color:var(--azul);background:var(--azul-s);border:2px solid var(--card-bg);margin-left:-6px;}
  .av:first-child{margin-left:0;}
  .pill{display:inline-block;padding:3px 9px;border-radius:10px;font-size:11px;font-weight:600;white-space:nowrap;}
  .p-gris{background:var(--gris);color:var(--suave);}
  .p-rojo{background:var(--rojo-s);color:var(--rojo);}
  .p-amber{background:var(--amber-s);color:var(--amber);}
  .p-verde{background:var(--verde-s);color:var(--verde);}
  .p-azul{background:var(--azul-s);color:var(--azul-c);}
  .cid{font-size:10px;color:var(--suave);margin-top:6px;}

  /* DETALLE DE CAMPAÑA */
  .volver{background:none;border:none;color:var(--azul-c);font-weight:600;font-size:13px;margin-bottom:12px;}
  .dhead{background:var(--card-bg);border-radius:var(--r);padding:18px;box-shadow:var(--sombra);display:grid;gap:10px;margin-bottom:14px;}
  .dtop{display:flex;gap:14px;align-items:flex-start;}
  .dtit{font-size:20px;font-weight:800;color:var(--azul);}
  .dtit2{display:flex;align-items:center;flex-wrap:wrap;gap:10px 14px;}
  .dtit2 .dnom{font-size:28px;font-weight:800;color:var(--azul);line-height:1.1;}
  .temporada{display:inline-flex;align-items:center;gap:8px;padding:6px 16px;border-radius:24px;font-size:22px;font-weight:800;line-height:1.2;color:#fff;background:#2e7d32;box-shadow:0 2px 8px rgba(0,0,0,.12);}
  .temporada.t-verano{background:#d97706;}.temporada.t-otono{background:#b45309;}.temporada.t-invierno{background:#1d4ed8;}.temporada.t-primavera{background:#15803d;}
  .dinfo{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px 22px;margin-top:12px;}
  .dinfo .dk{font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--suave);margin-bottom:2px;}
  .dinfo .dv{font-size:14px;color:var(--texto);line-height:1.35;}
  .dinfo .dwide{grid-column:span 2;}
  .cfoot .pill.chip-b{cursor:pointer;border:1px solid transparent;font-size:12px;padding:5px 11px;}
  .cfoot .pill.chip-b:hover{filter:brightness(.96);border-color:currentColor;}
  .cfoot .pill.chip-b[aria-pressed="true"]{border-color:currentColor;box-shadow:0 0 0 2px rgba(0,0,0,.05);}
  .cfoot .pill.chip-b::after{content:' ▾';font-size:10px;}
  .cfoot .pill.chip-b[aria-pressed="true"]::after{content:' ▴';}
  .chip-panel{background:var(--gris);border-radius:10px;padding:12px 14px;display:grid;gap:10px;}
  .chip-panel .cp-h{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:13px;}
  .chip-panel .cp-g b{display:block;font-size:12px;color:var(--suave);text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px;}
  .chip-panel .cp-l{display:flex;flex-wrap:wrap;gap:6px;}
  .chip-panel .cp-e{border:1px solid var(--borde);background:var(--card-bg);border-radius:8px;padding:5px 10px;font-size:13px;text-align:left;cursor:pointer;}
  .chip-panel .cp-e:hover{border-color:var(--azul-c);}
  .chip-panel .cp-e small{display:block;color:var(--suave);font-size:11px;max-width:260px;}
  @media(max-width:760px){ .dtit2 .dnom{font-size:22px;} .temporada{font-size:17px;padding:4px 12px;} .dinfo{grid-template-columns:1fr 1fr;gap:8px 14px;} .dinfo .dwide{grid-column:span 2;} }
  .dprogs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 20px;}
  .subnav{display:flex;gap:2px;border-bottom:1px solid var(--borde);margin-bottom:14px;overflow-x:auto;}
  .subnav button{border:none;background:none;padding:10px 16px;font-weight:700;color:var(--suave);border-bottom:3px solid transparent;white-space:nowrap;}
  .subnav button[aria-selected="true"]{color:var(--verde);border-bottom-color:var(--verde);}

  /* GRILLA ESTACIÓN × DÍA */
  .sgrid{width:100%;border-collapse:separate;border-spacing:0;background:var(--card-bg);border-radius:var(--r);box-shadow:var(--sombra);font-size:12px;}
  .sgrid th{font-size:11px;font-weight:700;color:var(--suave);padding:10px 8px;border-bottom:1px solid var(--borde);text-align:left;white-space:nowrap;}
  .sgrid th small{display:block;font-weight:500;}
  .sgrid td{padding:7px 8px;border-bottom:1px solid var(--borde);vertical-align:top;}
  .sgrid tr:last-child td{border-bottom:none;}
  .sgrid .scol{position:sticky;left:0;background:var(--card-bg);z-index:1;min-width:96px;max-width:190px;}
  .sgrid .scol b{font-size:13px;}
  .sgrid .scol small{display:block;color:var(--suave);font-size:10px;font-variant-numeric:tabular-nums;}
  .sgrid td.sinr{background:var(--gris);}
  .tags{display:flex;flex-wrap:wrap;gap:4px;min-width:120px;}
  .tag{border:none;border-radius:6px;padding:3px 7px;font-size:10.5px;font-weight:700;white-space:nowrap;}
  .t-ok{background:var(--verde-s);color:var(--verde);}
  .t-par{background:var(--amber-s);color:var(--amber);}
  .t-no{background:var(--rojo-s);color:var(--rojo);}
  .t-na{background:var(--gris);color:var(--suave);}
  .t-pend{background:var(--card-bg);color:var(--suave);border:1px dashed var(--suave);}

  /* CHECKLIST */
  .grupo{scroll-margin-top:140px;}
  .grupo{background:var(--card-bg);border-radius:var(--r);box-shadow:var(--sombra);margin-bottom:12px;overflow:hidden;}
  .grupo>summary{list-style:none;padding:13px 18px;display:flex;align-items:center;gap:8px 10px;flex-wrap:wrap;cursor:pointer;}
  .grupo[open]>summary{border-bottom:1px solid var(--borde);}
  .grupo>summary::-webkit-details-marker{display:none;}
  .grupo>summary::before{content:"▸";color:var(--suave);transition:transform .15s;}
  .grupo[open]>summary::before{transform:rotate(90deg);}
  .gtit{font-size:14px;font-weight:700;color:var(--azul);}
  .gesp{font-size:11px;color:var(--suave);}
  .gcount{margin-left:auto;font-size:12px;font-weight:700;color:var(--suave);font-variant-numeric:tabular-nums;}
  .st{padding:10px 18px;border-bottom:1px solid var(--borde);display:grid;gap:8px;}
  .st:last-child{border-bottom:none;}
  .st.need{background:var(--rojo-s);}
  .st.foco{outline:2px solid var(--azul-c);outline-offset:-2px;}
  .st-top{display:flex;align-items:center;gap:6px 14px;flex-wrap:wrap;}
  .st-name{font-weight:700;font-size:15px;min-width:58px;}
  .st-coord{font-size:11px;color:var(--suave);font-variant-numeric:tabular-nums;}
  .estado{display:inline-flex;border:1px solid var(--borde);border-radius:20px;overflow:hidden;margin-left:auto;background:var(--card-bg);}
  .estado button{border:none;background:none;padding:6px 12px;font-size:12px;font-weight:700;color:var(--suave);min-width:44px;min-height:36px;}
  .estado button+button{border-left:1px solid var(--borde);}
  .estado button[aria-pressed="true"][data-v="Realizado"]{background:var(--verde);color:#fff;}
  .estado button[aria-pressed="true"][data-v="Parcial"]{background:var(--amber);color:#fff;}
  .estado button[aria-pressed="true"][data-v="No realizado"]{background:var(--rojo);color:#fff;}
  .estado button[aria-pressed="true"][data-v="No aplica"]{background:var(--suave);color:#fff;}
  [data-theme="dark"] .estado button[aria-pressed="true"]{color:#0f1623;}
  .st-meta{display:flex;align-items:center;gap:6px 14px;flex-wrap:wrap;font-size:12px;color:var(--suave);}
  .st-meta label{display:flex;align-items:center;gap:6px;}
  .sel,.inp{padding:6px 10px;border-radius:8px;border:1px solid var(--borde);background:var(--card-bg);color:var(--texto);font-size:13px;outline:none;max-width:100%;}
  .sel:focus,.inp:focus{border-color:var(--verde);}
  .lnk{background:none;border:none;color:var(--azul-c);font-weight:600;font-size:12px;margin-left:auto;}
  .warnline{color:var(--rojo);font-size:12px;font-weight:700;}
  .motivo{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--suave);}
  .motivo .inp{flex:1;}
  .panel{background:var(--gris);border-radius:10px;padding:12px;display:grid;gap:10px;}
  .ctitle{font-size:11px;font-weight:700;color:var(--suave);text-transform:uppercase;letter-spacing:.5px;}
  table.mini{border-collapse:collapse;font-size:12px;}
  table.mini th{text-align:left;padding:5px 9px;font-size:10px;font-weight:700;color:var(--suave);text-transform:uppercase;border-bottom:1px solid var(--borde);}
  table.mini td{padding:5px 9px;border-bottom:1px solid var(--borde);vertical-align:middle;}
  table.mini td small{display:block;color:var(--suave);font-size:10.5px;}
  .reps{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;}
  .rep{display:inline-flex;align-items:center;gap:3px;font-size:10.5px;color:var(--suave);}
  .sgrid .scol .sect{font-size:10px;color:var(--suave);font-weight:600;}
  .chk{width:20px;height:20px;accent-color:var(--verde);}
  .calc{font-size:12px;background:var(--card-bg);color:var(--suave);border-radius:8px;padding:7px 10px;}
  .fields{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(min(100%,160px),1fr));}
  .fields label{display:grid;gap:4px;font-size:11px;color:var(--suave);font-weight:600;}

    var m={id:r.id_monitoreo,cod:cod[r.monitoreo]||String(r.id_monitoreo).split('-').pop(),nombre:r.monitoreo,informe:r.nombre_informe||'',n_informe:r.n_informe||'',etapa:r.etapa||'',frecuencia:r.frecuencia||'',periodos:[],items:[],estaciones:[]};
    if(p.monitoreos.some(function(x){return x.cod===m.cod;})) m.cod=m.cod+'-'+m.n_informe;   // mismo monitoreo en otro informe del proyecto

  (H.PERIODOS||[]).forEach(function(r){ var m=mid[r.id_monitoreo]; if(m&&r.periodo&&m.periodos.indexOf(r.periodo)<0) m.periodos.push(r.periodo); });
  (H.PARAMETROS||[]).forEach(function(r){ var m=mid[r.id_monitoreo]; if(!m||!r.parametro) return;

  (H.ESTACIONES||[]).forEach(function(r){ var p=M[r.id_proyecto]; if(!p||r.estacion==null) return; var e=String(r.estacion);
    p.est[e]={e:r.utm_este||'',n:r.utm_norte||'',ef:r.utm_este_fin||'',nf:r.utm_norte_fin||'',sector:r.sector||'',huso:r.huso||'',datum:r.datum||''}; p.orden.push(e); });
  (H.ESTACION_MONITOREO||[]).forEach(function(r){ var m=mid[r.id_monitoreo]; if(m&&r.estacion!=null&&m.estaciones.indexOf(String(r.estacion))<0) m.estaciones.push(String(r.estacion)); });

    var cuenta={}; p.monitoreos.forEach(function(m){ cuenta[m.nombre]=(cuenta[m.nombre]||0)+1; });
    p.monitoreos.forEach(function(m){ if(cuenta[m.nombre]>1){ var sg=(String(m.informe).match(/\(([^)]+)\)\s*$/)||[])[1]; m.nombre=m.nombre+' · '+(sg||('Informe '+(m.n_informe||'?'))); } }); });

}

function prog(c){
  var T=c.tareas.length,done=0,sinMarcar=0,sinMotivo=0,noReal=0,parcial=0;
  c.tareas.forEach(function(t){ if(t.estado==='Realizado'||t.estado==='No aplica') done++; if(!t.estado) sinMarcar++; if(t.estado==='No realizado') noReal++; if(t.estado==='Parcial') parcial++;
    if((t.estado==='No realizado'||t.estado==='Parcial')&&!t.motivo.trim()) sinMotivo++; });
  var D=c.docs.length,dDone=0,dPend=0,dSinRuta=0;
  c.docs.forEach(function(d){ if(d.estado==='Completo'&&d.ruta.trim()) dDone++; if(d.estado!=='Completo') dPend++; if(d.estado==='Completo'&&!d.ruta.trim()) dSinRuta++; });
  return {T:T,done:done,pm:T?Math.round(100*done/T):0,pd:D?Math.round(100*dDone/D):0,sinMarcar:sinMarcar,sinMotivo:sinMotivo,noReal:noReal,parcial:parcial,D:D,dPend:dPend,dSinRuta:dSinRuta};
}
function estadoCamp(c){ var p=prog(c); if(p.pm===100&&p.pd===100) return 'Completa'; if(c.ini>HOY_S) return 'Programada'; if(c.fin>=HOY_S) return 'En terreno'; return 'Con pendientes'; }
function vol(fi,ff,d,k){ var v=(+ff)-(+fi); if(!isFinite(v)||!d||!k) return null; return v*k*Math.PI*Math.pow(d/2,2); }

function bitLocal(accion,d){ var b=S.bit||[], e={el:ahoraTxt(),por:usuario,accion:accion,campana:d.campana||d.id||'',detalle:'',mon:'',est:'',antes:'',despues:''};

  else if(accion==='crearCampana') e.accion='crear campaña';
  else if(accion==='eliminarCampana') e.accion='eliminar campaña';

function enviar(accion,datos){ guardarCamp(); S.gdActivo=true; S.gdError=''; if(DEMO){ bitLocal(accion,datos||{}); pintarGd(); return; } S.cola.push({accion:accion,datos:datos,ts:new Date().toISOString()}); guardarCola(); flush(); pintarNet(); }
function guardarCola(){ try{ localStorage.setItem('ceamar_terreno_cola',JSON.stringify(S.cola)); }catch(e){} }
function hayRed(){ return DEMO?true:navigator.onLine; }
function flush(){
  if(!hayRed()||!S.cola.length) return;
  if(DEMO){ S.cola=[]; guardarCola(); return; }
  if(!SESION||S.enviando) return;
  var it=S.cola[0]; S.enviando=true;
  api(it.accion,it.datos).then(function(r){ S.enviando=false;
    S.gdFallo=false; if(r.ok){ S.cola.shift(); guardarCola(); pintarNet(); if(S.cola.length) flush(); else if(S.mezcla){ S.mezcla=false; setTimeout(recargar,800); } return; }
    if(r.error==='sesion'){ pintarNet(); pedirLogin(r.mensaje); return; }
    S.cola.shift(); guardarCola(); S.gdError=r.mensaje||r.error||'error del servidor'; pintarNet(); toast(r.mensaje||r.error||'No se pudo guardar el cambio'); recargar();
  }).catch(function(){ S.enviando=false; S.gdFallo=true; pintarNet(); setTimeout(flush,15000); });
}
function api(accion,datos,extra){
  var body={accion:accion,sesion:SESION,datos:datos||{}}; if(extra) Object.keys(extra).forEach(function(k){ body[k]=extra[k]; });
  return fetch(CONFIG.APPS_SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)}).then(function(r){ return r.json(); });
}

function aplicarDatos(r){ if(!DEMO&&r&&r.matrizVer&&r.matrizVer!==MATRIZ_VER){ return matrizAlDia(r.matrizVer).then(function(){ aplicarDatos0(r); }); } aplicarDatos0(r); return Promise.resolve(); }
function aplicarDatos0(r){
  var pend=pendientesCola(), viejo={}; (CAMP_ALL||[]).forEach(function(c){ viejo[c.id]=c; });
  fijarUsuario(r.usuario); if(r.personal&&r.personal.length) PERSONAL=r.personal;
  CAMP_ALL=(r.campanas||[]).filter(function(c){ return MATRIZ[c.proyecto]; }).map(function(c){
    var cods=[]; c.tareas.forEach(function(t){ if(cods.indexOf(t.mon)<0) cods.push(t.mon); t.datos=t.datos||{}; t.est0=t.estado||''; });
    c.mons=MATRIZ[c.proyecto].monitoreos.map(function(m){return m.cod;}).filter(function(k){return cods.indexOf(k)>=0;});
    c.monResp=c.monResp||{}; c.monRedes=c.monRedes||{}; c.monClima=c.monClima||{}; c.planillas=c.planillas||{}; Object.keys(c.monRedes).forEach(function(k){ if(typeof c.monRedes[k]==='string') c.monRedes[k]=redesLeer(c.monRedes[k]); }); c.estadoAdm=c.estadoAdm||'Abierta'; return c; });
  Object.keys(pend).forEach(function(id){ var i=-1; CAMP_ALL.forEach(function(c,k){ if(c.id===id) i=k; });
    if(pend[id]==='eliminarCampana'){ if(i>=0) CAMP_ALL.splice(i,1); return; }
    if(viejo[id]){ if(i>=0) CAMP_ALL[i]=viejo[id]; else CAMP_ALL.push(viejo[id]); } });
  S.mezcla=Object.keys(pend).length>0;
  vista(); if(S.cid&&!getC(S.cid)){ S.cid=null; if(S.tab==='detalle') S.tab='calendario'; }
  guardarCopia(); pintarUsuario(); render();
}
function recargar(){ if(DEMO||!SESION||S.cola.length) return; api('datos').then(function(r){ if(r.ok) aplicarDatos(r); else if(r.error==='sesion') pedirLogin(r.mensaje); }).catch(function(){}); }
var gisCargado=false;
function pedirLogin(msg){
  var ov=document.getElementById('login'); ov.hidden=false; document.getElementById('login-msg').textContent=msg||'';
  function boton(){ google.accounts.id.initialize({client_id:CONFIG.GOOGLE_CLIENT_ID,callback:alEntrar,ux_mode:'popup'});
    google.accounts.id.renderButton(document.getElementById('login-btn'),{theme:'filled_blue',size:'large',shape:'pill',text:'signin_with',locale:'es',width:280}); }
  if(gisCargado){ boton(); return; }
  var sc=document.createElement('script'); sc.src='https://accounts.google.com/gsi/client'; sc.async=true; sc.onload=function(){ gisCargado=true; boton(); };
  sc.onerror=function(){ document.getElementById('login-msg').textContent='No se pudo cargar el inicio de sesión de Google. Revisa la conexión.'; }; document.head.appendChild(sc);
}
function alEntrar(resp){
  var m=document.getElementById('login-msg'); m.textContent='Verificando…';
  api('login',null,{idToken:resp.credential}).then(function(r){
    if(!r.ok){ m.textContent=r.mensaje||r.error||'No se pudo entrar'; return; }
    SESION=r.sesion; try{ localStorage.setItem('ceamar_terreno_sesion',SESION); }catch(e){}
    document.getElementById('login').hidden=true; aplicarDatos(r); flush(); toast('Hola, '+r.usuario.nombre.split(' ')[0]);
  }).catch(function(){ m.textContent='Sin conexión con el servidor. Intenta de nuevo.'; });
}
function salir(){ if(SESION) api('logout').catch(function(){}); SESION=''; try{ localStorage.removeItem('ceamar_terreno_sesion'); localStorage.removeItem('ceamar_terreno_copia'); localStorage.removeItem('ceamar_matriz'); }catch(e){} MATRIZ_VER=''; window.MATRIZ_DATOS=null; usarMatriz(); fijarUsuario(null); CAMP_ALL=[]; vista(); pedirLogin('Sesión cerrada.'); }

// Lectura de Google Sheets (mismo método que avance-informes), para cuando se conecten las planillas.
function fetchSheet(id,hoja){
  var url='https://docs.google.com/spreadsheets/d/'+id+'/gviz/tq?tqx=out:json&sheet='+encodeURIComponent(hoja)+'&headers=1';
  return fetch(url).then(function(r){return r.text();}).then(function(txt){
    var m=txt.match(/google\.visualization\.Query\.setResponse\(([\s\S]*)\)/); if(!m) return [];
    var j=JSON.parse(m[1]), cols=(j.table.cols||[]).map(function(c){return c.label;});
    return (j.table.rows||[]).map(function(r){ var o={}; (r.c||[]).forEach(function(cell,i){ o[cols[i]]=cell?(typeof cell.v==='number'?cell.v:(cell.f!=null?cell.f:cell.v)):''; }); return o; });
  });

// Aviso de guardado (abajo a la izquierda): Guardando… → ✓ Guardado, o Sin señal si queda en cola.
function pintarGd(){ var el=document.getElementById('guardado'); if(!el||!S.gdActivo) return; var n=S.cola.length, h, cl;
  if(S.gdError){ cl='gd-err'; h='⚠ No se guardó: '+esc(S.gdError); }
  else if(n&&(!hayRed()||S.gdFallo)){ cl='gd-off'; h='<span>Sin señal · '+n+' cambio'+(n>1?'s':'')+' guardado'+(n>1?'s':'')+' en el celular<br><small style="font-weight:600;font-size:13px">Se enviará'+(n>1?'n':'')+' solo'+(n>1?'s':'')+' al volver la señal</small></span>'; }
  else if(n){ cl='gd-run'; h='<span class="gd-sp"></span>Guardando…'; }
  else { cl='gd-ok'; h='Guardado'+(DEMO?' en este equipo':'')+' · '+new Date().toTimeString().slice(0,5); }
  el.className='gd on '+cl; el.innerHTML=h; clearTimeout(S.gdT);

// ─── ALERTAS ─────────────────────────────────────────────
function renderAlertas(){
  var sm=0, docs=0, terr=[], sinReg=0, porProg=0;
  CAMP.forEach(function(c){ var p=prog(c), e=estadoCamp(c); sm+=p.sinMotivo; if(e!=='Programada') docs+=p.dPend+p.dSinRuta; if(e==='En terreno') terr.push(MATRIZ[c.proyecto].corto); });
  planAnual(S.anio).forEach(function(r){ r.slots.forEach(function(x){ if(x.k==='sinr') sinReg++; if(x.k==='porp' && x.actual) porProg++; }); });
  var h=[];
  if(sm) h.push('<div class="alerta alerta-rojo"><b>'+sm+'</b> '+(sm===1?'estación no realizada o parcial sin motivo':'estaciones no realizadas o parciales sin motivo')+'</div>');
  if(docs) h.push('<div class="alerta alerta-amber"><b>'+docs+'</b> documentos pendientes o sin ruta del servidor</div>');
  if(sinReg) h.push('<div class="alerta alerta-rojo"><b>'+sinReg+'</b> campaña'+(sinReg>1?'s':'')+' del plan '+S.anio+' sin registro</div>');
  if(porProg && esCoord()) h.push('<div class="alerta alerta-amber"><b>'+porProg+'</b> campaña'+(porProg>1?'s':'')+' del periodo actual por programar</div>');
  // Avisos generales desactivados: distraían más que ayudar (lo pendiente está en la pestaña Pendientes).
  var al=document.getElementById('alertas'); al.innerHTML=''; al.hidden=true;
}

function renderMes(){
  var y=S.ym[0], m=S.ym[1], first=new Date(y,m,1), start=new Date(first); start.setDate(1-((first.getDay()+6)%7));

// ─── CALENDARIO: AÑO (seguimiento de proyectos) ──────────
// Cada periodo de la matriz ocupa sus meses (estaciones del año: Verano ene–mar, Otoño abr–jun, Invierno jul–sep, Primavera oct–dic).
function planAnual(anio){
  var mesHoy=HOY.getMonth()+1, anioHoy=HOY.getFullYear();
  return Object.keys(MATRIZ).map(function(pid){
    var p=MATRIZ[pid];
    var slots=p.periodos.map(function(per){
      var ms=mesesPeriodo(per); if(!ms.length) return null;
      var fin=iso(new Date(anio,ms[ms.length-1],0)), ini=anio+'-'+pad(ms[0])+'-01';
      var c=CAMP.filter(function(x){return x.proyecto===pid&&x.anio===anio&&x.periodo===per;})[0];
      var actual=anio===anioHoy&&ms.indexOf(mesHoy)>=0, mons=monsDe(pid,per);
      var s={per:per,meses:ms,actual:actual,mons:mons,ini:ini,fin:fin};
      if(c){ s.k='camp'; s.c=c; s.e=estadoCamp(c); }
      else if(fin<(CONFIG.INICIO_SEGUIMIENTO||'')) s.k='previo';
      else if(fin<HOY_S) s.k='sinr';
      else s.k='porp';
      return s;
    }).filter(Boolean);
    return {pid:pid,p:p,slots:slots};
  });
}

function apiS(accion,datos){ if(!DEMO) return api(accion,datos);
  var pins={}; try{ pins=JSON.parse(localStorage.getItem('demo_pins')||'{}'); }catch(e){}
  var hsh=function(s){ var x=5381; for(var i=0;i<s.length;i++) x=((x*33)^s.charCodeAt(i))>>>0; return ('00000000'+x.toString(16)).slice(-8).toUpperCase(); };
  var r={ok:true};
  if(accion==='pinEstado') r.tiene=!!pins[usuario];
  else if(accion==='crearPin'){ if(pins[usuario]) r={ok:false,mensaje:'Ya tienes un código.'}; else { pins[usuario]=hsh('s'+datos.pin); localStorage.setItem('demo_pins',JSON.stringify(pins)); } }
  else if(accion==='reiniciarPin'){ delete pins[datos.nombre]; localStorage.setItem('demo_pins',JSON.stringify(pins)); }
  else if(accion==='firmar'){ if(pins[usuario]!==hsh('s'+datos.pin)) r={ok:false,mensaje:'Código incorrecto.'}; else { var R=JSON.parse(datos.datos); R.firma={por:usuario,el:new Date().toISOString().slice(0,10)+' '+ahoraTxt().slice(-5),cod:hsh(JSON.stringify(R.hdr||{}))+'AB'}; r.R=R; } }
  else if(accion==='anularFirma'){ var c=getC(datos.campana), R2=JSON.parse(JSON.stringify(c.planillas[datos.clave])); R2.anulaciones=(R2.anulaciones||[]).concat([{firma:R2.firma,firmas:R2.firmas||{},por:usuario,el:R2.firma.el,motivo:datos.motivo}]); delete R2.firma; delete R2.firmas; r.R=R2; }
  else if(accion==='firmarParte'){ var c3=getC(datos.campana), R3=JSON.parse(JSON.stringify(c3.planillas[datos.clave])), h3=R3.hdr||{}, nom=datos.parte==='evaluador'?h3.evaluador:h3[datos.parte+'_nombre'];
    if(!R3.firma) r={ok:false,mensaje:'Primero se firma el registro.'}; else if(!pins[nom]) r={ok:false,mensaje:nom+' aún no tiene código de firma: debe crearlo entrando con su cuenta.'}; else if(pins[nom]!==hsh('s'+datos.pin)) r={ok:false,mensaje:'Código incorrecto.'};
    else { R3.firmas=R3.firmas||{}; R3.firmas[datos.parte]={por:nom,el:new Date().toISOString().slice(0,10)+' '+ahoraTxt().slice(-5),cod:hsh(nom+datos.parte)+'PF'}; r.R=R3; } }
  bitLocal(accion,datos||{}); return Promise.resolve(r); }

// Llena una plantilla PDF (formato oficial) con los valores, según las cajas de layout.json.
function dibujarSSO(PDFLib, doc, fuente, negrita, lay, val, pagOff){
  pagOff=pagOff||0;

      ls.forEach(function(l,i){ var tx=limpio(l); while(tx&&(i===0?negrita:fuente).widthOfTextAtSize(tx,fs)>w) tx=tx.slice(0,-1); pg.drawText(tx,{x:x0+3,y:y0-i*fs*1.2,size:fs,font:i===0?negrita:fuente,color:azul}); }); return; }
    if(d.t==='x'){ var s=Math.min(10,h-2); pg.drawText('X',{x:(x0+x1)/2-negrita.widthOfTextAtSize('X',s)/2,y:H-(t+bo)/2-s*0.35,size:s,font:negrita}); return; }
    var txt=limpio(v);
    if(d.t==='multi'){
      for(var s=9;s>=5;s-=0.5){ var lines=[]; txt.split('\n').forEach(function(par){ var cur=''; par.split(/\s+/).forEach(function(pal){ var p2=cur?cur+' '+pal:pal; if(fuente.widthOfTextAtSize(p2,s)>w&&cur){ lines.push(cur); cur=pal; } else cur=p2; }); lines.push(cur); });
        if(lines.length*s*1.2<=h-3||s<=5){ var y=H-t-s-1.5; if(lines.length===1&&h<30) y=H-(t+bo)/2-s*0.35;
          lines.forEach(function(l){ if(y<H-bo) return; var ll=l; while(ll&&fuente.widthOfTextAtSize(ll,s)>w) ll=ll.slice(0,-1); pg.drawText(ll,{x:x0+3,y:y,size:s,font:fuente}); y-=s*1.2; }); return; } }
      return; }

    while(txt&&fuente.widthOfTextAtSize(txt,s)>w) txt=txt.slice(0,-1);

  });
}
